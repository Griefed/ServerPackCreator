# Local development stack.
#
#   docker compose -f docker/docker-compose-dev.yml up -d
#
# brings up only the DEPENDENCIES. ServerPackCreator itself runs from IntelliJ IDEA -- the
# `WebService (dev stack)` run configuration in `.run/` -- so you keep the debugger and hot-swap.
# That is why MongoDB publishes 27017: an IDE-run application, and IDEA's Database tool window,
# reach it over the host's loopback.
#
# The application service is opt-in:
#
#   docker compose -f docker/docker-compose-dev.yml --profile app up -d --build
#
# which builds and runs the real production image. That is the only way to exercise the s6 init
# script and the `overrides.properties` it composes from the SPC_* variables below.
#
# `docker/docker-compose.yml` is the deployment file users copy; this one is not. Resetting the
# database means `down -v`, because `init-mongo.js` runs only against an empty /data/db.

# The deployment compose file uses the same service names. Without a distinct project name the two
# fight over the same containers.
name: spc-dev

services:
  serverpackcreatordb:
    # Kept in step with docker/docker-compose.yml deliberately: a dev database on a different
    # release than production tests the wrong thing.
    #
    # This image refuses to start on a host kernel between 6.19.0 and 7.0.13, with "MongoDB cannot
    # start: Linux kernel versions 6.19.0 through 7.0.13 have a known incompatibility"
    # (https://jira.mongodb.org/browse/SERVER-121912 -- upstream TCMalloc violates the rseq ABI).
    # The guard is the fix, not the bug: the releases without it start and then crash. Docker
    # Desktop's linuxkit kernel crosses that range, so an older Docker Desktop cannot run this.
    # Override the tag from an untracked `docker/.env` rather than editing this file:
    #
    #   SPC_DEV_MONGO_IMAGE=mongodb/mongodb-community-server:8.0.5-ubuntu2204
    image: ${SPC_DEV_MONGO_IMAGE:-mongodb/mongodb-community-server:8.0.34-ubuntu2204@sha256:c94014b3bf1a644e2b90f69e03e16bb0cbbe84389c1271c1b4a2e75e6cc46f14}
    # Published so the IDE-run application can reach the database. Nothing in the fast loop runs
    # inside this network.
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1234567890
      MONGO_INITDB_DATABASE: serverpackcreatordb
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init.js:ro
      - spcdb-data:/data/db
      - spcdb-conf:/data/configdb
    # `depends_on` alone only orders starts, and the application treats a reachable database as
    # optional at boot precisely so it survives losing that race. mongo-express does not: it exits.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Database browser at http://localhost:8081. IDEA Ultimate's Database tool window reads the same
  # database over the published port if you prefer it -- Community Edition has no such tool, which
  # is why this stays a browser-based viewer rather than being dropped.
  #
  # Mongoku rather than mongo-express: mongo-express's Docker Official Image is DEPRECATED and has
  # not been rebuilt since 2024-11-21, so its newest tag ships Node 20 on Alpine 3.19, both EOL.
  # The mongo-express project itself is alive, but it publishes no image of its own -- no releases
  # on `mongo-express-docker`, nothing on ghcr -- so there is no maintained build to move to.
  serverpackcreator-mongoku:
    image: huggingface/mongoku:2.11.3@sha256:99486754b32cabd2d9c3d98318cccfdccdfb6822976f23a066d41c77d1b219c7
    # Bound to the loopback address, NOT published on every interface: Mongoku has no authentication
    # of its own, where mongo-express had basic auth. That auth was `mexpress`/`mexpress` committed
    # in this file, so it kept nobody out who could read the repository; refusing the LAN entirely
    # is the stronger guarantee, and it costs a dev-only tool nothing.
    ports:
      - "127.0.0.1:8081:3100"
    depends_on:
      serverpackcreatordb:
        condition: service_healthy
    environment:
      # One connection URL, the same shape mongo-express took. authSource is admin: that is where
      # MONGO_INITDB_ROOT_USERNAME creates the root user.
      - MONGOKU_DEFAULT_HOST=mongodb://root:1234567890@serverpackcreatordb:27017/?authSource=admin
      # Required for EDITING, not just for links. Mongoku compares the request's origin against
      # this value and silently serves a read-only UI when they differ -- and they do differ by
      # construction here, because it listens on 3100 inside the container and is reached on 8081.
      # Left unset, the banner reads "To enable write operations, set the MONGOKU_SERVER_ORIGIN
      # environment variable" and every write is refused. Keep it in step with the published port.
      - MONGOKU_SERVER_ORIGIN=http://127.0.0.1:8081
      # No volume on purpose. Mongoku persists only its *list of servers*, to
      # MONGOKU_DATABASE_FILE ($HOME/.mongoku.db), and MONGOKU_DEFAULT_HOST re-seeds that on every
      # start -- so a volume would buy nothing and keep stale hosts after this file changes.

  # Opt-in: the real production image, built from this working tree. Slow -- its builder stage runs
  # a full Gradle build inside the container -- so it is for testing the artifact, not for iterating.
  serverpackcreator:
    profiles:
      - app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      serverpackcreatordb:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      - SPC_SCHEDULE_DATABASE_CLEANUP=0 0 0 * * *
      - SPC_SCHEDULE_FILES_CLEANUP=0 0 0 * * *
      - SPC_SCHEDULE_VERSIONS_REFRESH=0 0 0 * * *
      # These three must match the db service's MONGO_INITDB_* above: init-mongo.js creates exactly
      # one user, from MONGO_INITDB_ROOT_USERNAME/_PASSWORD, inside MONGO_INITDB_DATABASE - and a
      # connection-string's path segment doubles as its authSource.
      - SPC_DATABASE_PASSWORD=1234567890 # $ : / ? # [ ] @ those characters must be converted using https://datatracker.ietf.org/doc/html/rfc3986#section-2.1
      - SPC_DATABASE_USERNAME=root # $ : / ? # [ ] @ those characters must be converted using https://datatracker.ietf.org/doc/html/rfc3986#section-2.1
      - SPC_DATABASE_HOST=serverpackcreatordb
      - SPC_DATABASE_PORT=27017
      - SPC_DATABASE_DB=serverpackcreatordb
      - SPC_MAX_UPLOAD_SIZE=1000
      - SPC_CONFIGURATION_AIKAR=-Xms4G -Xmx4G -XX\:+UseG1GC -XX\:+ParallelRefProcEnabled -XX\:MaxGCPauseMillis\=200 -XX\:+UnlockExperimentalVMOptions -XX\:+DisableExplicitGC -XX\:+AlwaysPreTouch -XX\:G1NewSizePercent\=30 -XX\:G1MaxNewSizePercent\=40 -XX\:G1HeapRegionSize\=8M -XX\:G1ReservePercent\=20 -XX\:G1HeapWastePercent\=5 -XX\:G1MixedGCCountTarget\=4 -XX\:InitiatingHeapOccupancyPercent\=15 -XX\:G1MixedGCLiveThresholdPercent\=90 -XX\:G1RSetUpdatingPauseTimePercent\=5 -XX\:SurvivorRatio\=32 -XX\:+PerfDisableSharedMem -XX\:MaxTenuringThreshold\=1 -Dusing.aikars.flags\=https\://mcflags.emc.gs -Daikars.new.flags\=true
      - SPC_CONFIGURATION_DIRECTORIES_MUSTINCLUDE=addonpacks,blueprints,config,configs,customnpcs,defaultconfigs,global_data_packs,global_packs,kubejs,maps,mods,openloader,scripts,shrines-saves,structures,structurize,worldshape,Zoestria
      - SPC_CONFIGURATION_DIRECTORIES_SHOULDEXCLUDE=animation,asm,cache,changelogs,craftpresence,crash-reports,downloads,icons,libraries,local,logs,overrides,packmenu,profileImage,profileImage,resourcepacks,screenshots,server_pack,shaderpacks,simple-rpc,tv-cache
      - SPC_CONFIGURATION_FALLBACK_UPDATEURL=https\://raw.githubusercontent.com/Griefed/ServerPackCreator/main/serverpackcreator-api/src/main/resources/serverpackcreator.properties
      - SPC_SERVERPACK_AUTODISCOVERY_ENABLED=true
      - SPC_SERVERPACK_AUTODISCOVERY_FILTER=START
      - SPC_SERVERPACK_ZIP_EXCLUDE=minecraft_server.MINECRAFT_VERSION.jar,server.jar,libraries/net/minecraft/server/MINECRAFT_VERSION/server-MINECRAFT_VERSION.jar
      - SPC_SERVERPACK_ZIP_EXCLUDE_ENABLED=true
      - SPC_LOG_LEVEL=DEBUG
    ports:
      - "8080:8080"
    volumes:
      - modpacks:/app/serverpackcreator/modpacks
      - server-packs:/app/serverpackcreator/server-packs
      - logs:/app/serverpackcreator/logs

volumes:
  spcdb-data:
  spcdb-conf:
  modpacks:
  server-packs:
  logs:
