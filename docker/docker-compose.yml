version: '3'
services:
  serverpackcreator:
    container_name: serverpackcreator
    image: griefed/serverpackcreator:9.3.0@sha256:0edae87d3def5efdf3e12e91d66094f8490f2b5548a90e157ceec4bc7a5371c5 # For a list of available tags, see https://hub.docker.com/r/griefed/serverpackcreator/tags
    restart: unless-stopped
    depends_on:
      - serverpackcreatordb
    environment:
      - TZ=Europe/Berlin # Your timezone
      - PUID=1000 # Your user ID
      - PGID=1000 # Your group ID
      - SPC_SCHEDULE_DATABASE_CLEANUP=0 0 0 * * * #CRON expression
      - SPC_SCHEDULE_FILES_CLEANUP=0 0 0 * * * #CRON expression
      - SPC_SCHEDULE_VERSIONS_REFRESH=0 0 0 * * * #CRON expression
      # init-mongo.js creates exactly one user, from the db service's MONGO_INITDB_ROOT_* below, so these
      # two must be those same values. Leave both out entirely if your MongoDB has no authentication.
      - SPC_DATABASE_USERNAME=<DB_ROOT_USERNAME> # $ : / ? # [ ] @ those characters must be converted using https://datatracker.ietf.org/doc/html/rfc3986#section-2.1
      - SPC_DATABASE_PASSWORD=<DB_ROOT_PASSWORD> # $ : / ? # [ ] @ those characters must be converted using https://datatracker.ietf.org/doc/html/rfc3986#section-2.1
      - SPC_DATABASE_HOST=serverpackcreatordb
      - SPC_DATABASE_PORT=27017
      - SPC_DATABASE_DB=serverpackcreatordb # Must match MONGO_INITDB_DATABASE below: init-mongo.js creates the user inside that database, and a connection-string's path is also its authSource.
      - SPC_MAX_UPLOAD_SIZE=1000 #In MB
      - SPC_CONFIGURATION_AIKAR=-Xms4G -Xmx4G -XX\:+UseG1GC -XX\:+ParallelRefProcEnabled -XX\:MaxGCPauseMillis\=200 -XX\:+UnlockExperimentalVMOptions -XX\:+DisableExplicitGC -XX\:+AlwaysPreTouch -XX\:G1NewSizePercent\=30 -XX\:G1MaxNewSizePercent\=40 -XX\:G1HeapRegionSize\=8M -XX\:G1ReservePercent\=20 -XX\:G1HeapWastePercent\=5 -XX\:G1MixedGCCountTarget\=4 -XX\:InitiatingHeapOccupancyPercent\=15 -XX\:G1MixedGCLiveThresholdPercent\=90 -XX\:G1RSetUpdatingPauseTimePercent\=5 -XX\:SurvivorRatio\=32 -XX\:+PerfDisableSharedMem -XX\:MaxTenuringThreshold\=1 -Dusing.aikars.flags\=https\://mcflags.emc.gs -Daikars.new.flags\=true #Keep an eye out for proper escaping!
      - SPC_CONFIGURATION_DIRECTORIES_MUSTINCLUDE=addonpacks,blueprints,config,configs,customnpcs,defaultconfigs,global_data_packs,global_packs,kubejs,maps,mods,openloader,scripts,shrines-saves,structures,structurize,worldshape,Zoestria
      - SPC_CONFIGURATION_DIRECTORIES_SHOULDEXCLUDE=animation,asm,cache,changelogs,craftpresence,crash-reports,downloads,icons,libraries,local,logs,overrides,packmenu,profileImage,profileImage,resourcepacks,screenshots,server_pack,shaderpacks,simple-rpc,tv-cache
      - SPC_CONFIGURATION_FALLBACK_UPDATEURL=https\://raw.githubusercontent.com/Griefed/ServerPackCreator/main/serverpackcreator-api/src/main/resources/serverpackcreator.properties
      - SPC_SERVERPACK_AUTODISCOVERY_ENABLED=true
      - SPC_SERVERPACK_AUTODISCOVERY_FILTER=START
      - SPC_SERVERPACK_ZIP_EXCLUDE=minecraft_server.MINECRAFT_VERSION.jar,server.jar,libraries/net/minecraft/server/MINECRAFT_VERSION/server-MINECRAFT_VERSION.jar
      - SPC_SERVERPACK_ZIP_EXCLUDE_ENABLED=true
      - SPC_LOG_LEVEL=INFO
    ports:
      - "8080:8080"
    volumes:
      - ./modpacks:/app/serverpackcreator/modpacks
      - ./server-packs:/app/serverpackcreator/server-packs
      - ./logs:/app/serverpackcreator/logs

  serverpackcreatordb:
    # Stay on the 8.0 line: that is the only MongoDB the application is tested against
    # (`de.flapdoodle.mongodb.embedded.version=8.0.5` drives the whole -app suite). 8.3 and 9.0
    # images exist and are a deliberate, separate upgrade, not a patch bump.
    #
    # On a host kernel in the range 6.19.0 - 7.0.13 this image refuses to start, with
    # "MongoDB cannot start: Linux kernel versions 6.19.0 through 7.0.13 have a known
    # incompatibility" (https://jira.mongodb.org/browse/SERVER-121912 -- upstream TCMalloc
    # violates the rseq ABI). Docker Desktop's linuxkit kernel is currently inside that range, so
    # the database will not come up there. That is the guard working: the releases without it
    # start and then crash. Run the container on a 7.0.14+ or pre-6.19 kernel rather than
    # downgrading to an unguarded image.
    image: mongodb/mongodb-community-server:8.0.34-ubuntu2204@sha256:c94014b3bf1a644e2b90f69e03e16bb0cbbe84389c1271c1b4a2e75e6cc46f14
    container_name: serverpackcreatordb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: <DB_ROOT_USERNAME>
      MONGO_INITDB_ROOT_PASSWORD: <DB_ROOT_PASSWORD>
      MONGO_INITDB_DATABASE: serverpackcreatordb
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init.js:ro
      - spcdb-data:/data/db
      - spcdb-conf:/data/configdb

volumes:
  spcdb-data:
  spcdb-conf: