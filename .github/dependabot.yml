# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Reaches `.github/workflows` ONLY. Dependabot has no way to read `.forgejo/workflows`, where 40 of
  # this repository's 55 `uses:` lines live -- so those are bumped by hand and will drift between
  # sweeps. Do not read a green Dependabot here as "the actions are current".
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "Griefed"
    labels:
     - "dependencies"
     - "github-actions"
    target-branch: "develop"
    pull-request-branch-name:
      separator: "-"

###################################################
#.....................GRADLE......................#
###################################################
  # `directories`, with "/" FIRST, because that is where the versions actually are. Every module
  # declares its dependencies as `libs.*` aliases with no literal coordinate anywhere, so the three
  # per-module entries this replaced could never have found a version to bump -- Dependabot's Gradle
  # coverage here was zero, and the catalog stayed current only because it was bumped by hand. "/"
  # is the entry that reaches `gradle/libs.versions.toml`; the module directories are listed so a
  # literal coordinate added to one later is still seen.
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/serverpackcreator-api"
      - "/serverpackcreator-app"
      - "/serverpackcreator-clientside"
      - "/serverpackcreator-grinder"
      - "/serverpackcreator-plugin-example"
      - "/serverpackcreator-plugin-grinder"
      - "/serverpackcreator-plugin-selfextract"
      - "/serverpackcreator-plugin-servertest"
    schedule:
      interval: "monthly"
    assignees:
      - "Griefed"
    labels:
      - "dependencies"
      - "gradle"
    target-branch: "develop"
    pull-request-branch-name:
      separator: "-"

###################################################
#.......................NPM.......................#
###################################################
  - package-ecosystem: "npm"
    directory: "/serverpackcreator-web-frontend"
    schedule:
      interval: "monthly"
    assignees:
      - "Griefed"
    labels:
      - "dependencies"
      - "npm"
    target-branch: "develop"
    pull-request-branch-name:
      separator: "-"

###################################################
#.....................DOCKER......................#
###################################################
  # `directories`, not `directory: "/"` -- there has never been a Dockerfile at the repository root, so
  # the single most important pin Dependabot could have watched here (`eclipse-temurin:21-jdk-jammy` in
  # docker/Dockerfile) was watched by nothing at all. The three files are docker/Dockerfile and the
  # grinder's two.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/serverpackcreator-grinder/docker"
    schedule:
      interval: "monthly"
    assignees:
      - "Griefed"
    labels:
      - "dependencies"
      - "docker"
    target-branch: "develop"
    pull-request-branch-name:
      separator: "-"
