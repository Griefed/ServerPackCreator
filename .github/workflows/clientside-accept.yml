name: Clientside-mod acceptance

# Phase 3: when a maintainer adds the `accepted` label to a "[Clientside-mod Addition Request]"
# issue, turn the suggested entries from the verification-comment into a PR that adds them to the
# official fallback-list (GenerationConfig.kt + serverpackcreator.properties), targeting develop.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  accept:
    name: Open clientside-list PR
    if: >-
      github.event.label.name == 'accepted' &&
      contains(github.event.issue.title, '[Clientside-mod Addition Request]')
    runs-on: ubuntu-latest
    # On the job, not the workflow: every label added to any issue starts a run here, and a workflow-level
    # group is entered before the `if:` above is evaluated -- where a newer run replaces the pending one, so
    # a label added alongside `accepted` could discard the acceptance waiting its turn.
    concurrency:
      group: clientside-accept-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      # The comment lookup and the data block's parsing, from the commit this workflow runs from -- the
      # checkout above is `develop`, for the pull request. Second, because a checkout cleans its workspace.
      - uses: actions/checkout@v7
        with:
          path: .verification
          sparse-checkout: .github/scripts

      # Recover the report-JSON the verify workflow embedded in its sticky comment, so we apply the
      # exact entries a maintainer reviewed rather than re-deriving (and re-booting) them.
      - name: Extract report JSON from comment
        id: report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const verification = require('./.verification/.github/scripts/clientside-verification.js')
            const comment = await verification.findComment(github, { ...context.repo, issueNumber: context.issue.number })
            const json = comment && verification.dataBlockIn(comment.body)
            if (!json) {
              core.setOutput('found', 'false')
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
                body: 'Could not find a verification report to accept. Re-run the verification first.' })
              return
            }
            fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/clientside-report.json', json)
            core.setOutput('found', 'true')

      - name: Set up JDK 21
        if: steps.report.outputs.found == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.report.outputs.found == 'true'
        with:
          gradle-version: wrapper

      - name: Set permissions
        if: steps.report.outputs.found == 'true'
        run: chmod +x gradlew

      - name: Build ServerPackCreator jar
        if: steps.report.outputs.found == 'true'
        run: ./gradlew :serverpackcreator-app:bootJar --no-daemon

      - name: Apply entries to the fallback-list files
        if: steps.report.outputs.found == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/spc-home"
          JAR=$(ls serverpackcreator-app/build/libs/serverpackcreator-app-*.jar | grep -vE 'plain|javadoc|sources' | head -n1)
          java -jar "$JAR" \
            --home "$GITHUB_WORKSPACE/spc-home" \
            -clientsideapply --report "$GITHUB_WORKSPACE/clientside-report.json"

      - name: Open pull request
        if: steps.report.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: develop
          branch: clientside/issue-${{ github.event.issue.number }}
          add-paths: |
            serverpackcreator-api/src/main/kotlin/de/griefed/serverpackcreator/api/settings/GenerationConfig.kt
            serverpackcreator-api/src/main/resources/serverpackcreator.properties
          commit-message: "feat(api): add clientside-only mod(s) from #${{ github.event.issue.number }}"
          title: "Add clientside-only mod(s) — closes #${{ github.event.issue.number }}"
          body: |
            Automated from the accepted clientside-mod request #${{ github.event.issue.number }}.

            Adds the reviewed entries to the official fallback clientside-list
            (`GenerationConfig.kt` + `serverpackcreator.properties`).

            Closes #${{ github.event.issue.number }}
          labels: enhancement
          delete-branch: true
