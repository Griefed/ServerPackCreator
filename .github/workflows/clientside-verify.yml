name: Clientside-mod verification

# Boots a server with the requested mod on every "[Clientside-mod Addition Request]" issue and posts the
# verdicts, with each boot's console, as one comment that later runs update in place. The pipeline lives in
# clientside-report-reusable.yml.
#
# A boot runs the requested mod's code on the runner, so it needs someone with write access:
# - opened: booted unasked only when the author is an OWNER, MEMBER or COLLABORATOR. Anyone else's request is
#   told it waits for a maintainer.
# - edited: boots again only when the edit changed the project link or made the issue a request, and only
#   for those same authors; any other edit refreshes the report's proof line.
# - labeled `verify-boot`: a maintainer approves or re-runs one. So does a manual dispatch. Approving an
#   outsider's changed link again means removing and re-adding the label. The label is created by the
#   `resolve` job whenever the repository lacks it, so this route cannot silently not exist.
# The reusable workflow's `resolve` job decides (`bootAuthorised` in .github/scripts/clientside-verification.js).
#
# Deliberately no workflow-level `concurrency`. The issue form applies a label, so opening an issue also
# fires `labeled`, and a workflow-level group is entered before any job's `if:` is evaluated: that run would
# cancel the `opened` boot and then skip itself. The group is on the boot job, behind the `resolve` gate.

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to boot-verify"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify clientside-mod request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'verify-boot' ||
      (github.event.action != 'labeled' &&
       contains(github.event.issue.title, '[Clientside-mod Addition Request]'))
    uses: ./.github/workflows/clientside-report-reusable.yml
    with:
      issue_number: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    secrets: inherit
