name: Clientside-mod verification

# Phase 1 goal: on every "[Clientside-mod Addition Request]" issue, post the candidate clientside-list
# entries and a per-loader metadata-confidence as a single (updated-in-place) comment. Cheap and
# read-only — the actual pipeline lives in the reusable clientside-report workflow.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: clientside-verify-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify clientside-mod request
    if: contains(github.event.issue.title, '[Clientside-mod Addition Request]')
    uses: ./.github/workflows/clientside-report-reusable.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      boot: false
    secrets: inherit
