# Smoke test only. The canonical CI -- full gradle build, docker image build, Qodana, releases -- lives
# in .forgejo/workflows and runs on git.griefed.de. This exists so a pull request or a fork still gets a
# signal on GitHub, where contributors are.
#
# Keep it cheap and keep it green: if it starts needing secrets or producing artifacts, it has drifted
# into being a second CI and the work belongs on Forgejo instead.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "build"
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Set Permissions
        run: |
          chmod +x gradlew

      # THE BUILD LOGIC'S OWN TESTS, and `help` is genuinely the way to reach them. Gradle 8.0 made
      # buildSrc an included build and stopped running its lifecycle tasks from the main build -- a
      # maintainer confirms that is intended -- and neither `:buildSrc:check` nor
      # `gradle.includedBuild("buildSrc")` resolves from the root, while `-p buildSrc` fails outright
      # because `buildSrc/settings.gradle.kts` declares the foojay resolver with no version and only
      # the root build puts it on the classpath. What IS always built is buildSrc's jar, which
      # `buildSrc/build.gradle.kts` finalizes with `test`, so any root invocation runs them. This one
      # is here rather than left to the build below so a broken convention plugin fails in seconds
      # instead of after the frontend.
      - name: Verify the build logic
        run: ./gradlew help

      - name: Build with Gradle
        run: |
          ./gradlew -Pversion="${{ github.ref_name }}" build --info --full-stacktrace

      # No artifact upload: the release assets are produced on Forgejo now, and nothing here consumed
      # these. Test results are enough for a smoke test.
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-results
          path: |
            serverpackcreator-api/build/test-results/test/TEST-*.xml
            serverpackcreator-app/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
