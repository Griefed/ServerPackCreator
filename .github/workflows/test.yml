# Smoke test only. The canonical CI -- full gradle build, docker image build, Qodana, releases -- lives
# in .forgejo/workflows and runs on git.griefed.de. This exists so a pull request or a fork still gets a
# signal on GitHub, where contributors are.
#
# Keep it cheap and keep it green: if it starts needing secrets or producing artifacts, it has drifted
# into being a second CI and the work belongs on Forgejo instead.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "build"
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: wrapper

      - name: Set Permissions
        run: |
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew -Pversion="${{ github.ref_name }}" build --info --full-stacktrace

      # No artifact upload: the release assets are produced on Forgejo now, and nothing here consumed
      # these. Test results are enough for a smoke test.
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: test-results
          path: |
            serverpackcreator-api/build/test-results/test/TEST-*.xml
            serverpackcreator-app/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
