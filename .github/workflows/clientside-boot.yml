name: Clientside-mod verification (server-boot)

# Phase 2: the expensive, production-near signal. Boots a server per loader with the candidate mod
# force-included and watches for a crash, so a mod that crashes a server is flagged HIGH confidence
# even when its metadata claims server-safe. Gated behind the `verify-boot` label (or a manual
# dispatch) so it does not run on every issue edit — unlike the cheap metadata-only verify workflow.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to run the boot-verification for"
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: clientside-boot-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: true

jobs:
  boot:
    name: Boot-verify clientside-mod request
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'verify-boot'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      # Resolve the target issue (label event or manual dispatch) and pull the project-link from it.
      - name: Resolve issue and project link
        id: link
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue
              ? context.payload.issue.number
              : Number(context.payload.inputs.issue_number)
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber })
            core.setOutput('number', String(issueNumber))
            const match = (issue.body || '').match(/https?:\/\/(www\.)?(modrinth\.com|curseforge\.com)\/[^\s)]+/i)
            if (!match) {
              core.setOutput('found', 'false')
              return
            }
            core.setOutput('found', 'true')
            core.setOutput('url', match[0])

      - name: Set up JDK 21
        if: steps.link.outputs.found == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.link.outputs.found == 'true'
        with:
          gradle-version: wrapper

      - name: Set permissions
        if: steps.link.outputs.found == 'true'
        run: chmod +x gradlew

      - name: Build ServerPackCreator jar
        if: steps.link.outputs.found == 'true'
        run: ./gradlew :serverpackcreator-app:bootJar --no-daemon

      # Best-effort OS deps for the headless browser (only used for distribution-locked CurseForge
      # files). If this fails, non-locked mods still boot fine and locked ones degrade to inconclusive.
      - name: Install browser dependencies
        if: steps.link.outputs.found == 'true'
        continue-on-error: true
        run: npx --yes playwright install-deps chromium

      - name: Run boot verification
        if: steps.link.outputs.found == 'true'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/spc-home"
          JAR=$(ls serverpackcreator-app/build/libs/serverpackcreator-app-*.jar | grep -vE 'plain|javadoc|sources' | head -n1)
          echo "Using jar: $JAR"
          java -jar "$JAR" \
            --home "$GITHUB_WORKSPACE/spc-home" \
            -verifyclientside "${{ steps.link.outputs.url }}" \
            --output "$GITHUB_WORKSPACE/clientside-report.md"

      - name: Upload boot logs
        if: ${{ always() && steps.link.outputs.found == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: clientside-boot-logs
          path: spc-home/work/clientside-verify/boot/**/boot.log
          if-no-files-found: ignore

      - name: Post report comment
        if: steps.link.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- serverpackcreator-clientside-report -->'
            const issueNumber = Number('${{ steps.link.outputs.number }}')
            let body
            try {
              body = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/clientside-report.md', 'utf8')
            } catch (error) {
              body = marker + '\n## 🤖 Clientside-mod boot-verification failed\n\n'
                + 'No report was produced. See the workflow logs for details.'
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber })
            const existing = comments.find(c => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body })
            }
