# GitHub Pages: the Writerside help site with the Kotlin API reference nested inside it at `/api/`.
#
# This is the one piece of real work that is GitHub-native by necessity rather than by choice. The canonical
# CI is `.forgejo/workflows` (see .claude/rules/ci-workflows.md), and `.forgejo/workflows` existing means
# Forgejo ignores `.github/workflows` ENTIRELY -- so nothing here can ever run on Forgejo, and nothing
# Forgejo must do may live here. GitHub Pages can only be deployed from GitHub, and Forgejo has no Pages
# equivalent at all, so this is the only place the rendered site can be hosted from.
#
# It is NOT a second CI, the line `.github/workflows/test.yml` draws in its own header. It needs no secrets
# (`GITHUB_TOKEN` is injected, and Pages authenticates by OIDC), it tests nothing, and it gates nothing --
# a red run here costs a stale docs site and nothing else.
#
# THREE DIFFERENCES from the 8.x.x job it replaces, all deliberate:
#   1. It publishes the WHOLE help site, not just Dokka. Dokka lives at `/api/`, so
#      https://griefed.github.io/ServerPackCreator/ is the Writerside help. Deep Dokka URLs are therefore
#      one path segment deeper than they were; the gain is that this deployment and the nginx image have
#      one layout, so `/api/` means the same thing in both.
#   2. It deploys via `actions/deploy-pages` rather than committing to a `gh-pages` branch. REQUIRES
#      Settings -> Pages -> Source = "GitHub Actions"; while it is still set to "Deploy from a branch",
#      this workflow succeeds and the site does not change.
#   3. `-Pversion` is actually set on a tag. The 8.x.x `pages` job read `needs.preparations.outputs.version`
#      without declaring `needs: preparations`, and the `needs` context only carries jobs that are declared
#      there -- so it expanded to the empty string and every published page was built as `-Pversion=""`.
name: GitHub Pages

# `main` and release tags only. Pages is a single site with a single live deployment, so building it from
# every branch push would have `develop` and `alpha` overwriting each other and the released docs.
on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false`, unlike every other workflow here: cancelling a half-finished Pages deployment
# is how a site ends up serving a partially-swapped tree. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Both must match `.forgejo/workflows/docs.yml`, which builds the same bundle for the container image.
  # ARTIFACT is what the builder names its output for instance id `spch` (`webHelp<ID-UPPER>2-all.zip`).
  INSTANCE: Writerside/spch
  ARTIFACT: webHelpSPCH2-all.zip
  # Pinned, not `latest`: a docs site that silently rebuilds itself on someone else's release is a site that
  # breaks without a commit to blame. Bump it here and in docs.yml together.
  # NOTE the two pull the SAME tag from DIFFERENT registries -- docs.yml runs `jetbrains/writerside-builder`
  # from Docker Hub by hand, while this action hard-codes
  # `registry.jetbrains.team/p/writerside/builder/writerside-builder`. A Docker Hub tag is not automatically
  # a valid value here, so check both with `docker manifest inspect` before bumping.
  DOCKER_VERSION: 2026.02.8644

jobs:
  build:
    name: "Build help site"
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # The seven root-level documents are the source of truth and the copies under `Writerside/topics/` are
      # generated and gitignored, so a fresh checkout does NOT have them -- without this step the Changelog,
      # License, Readme, Contributing, Security and Code-of-Conduct topics are missing from the built site.
      # Byte-identical to the `Stage documents and images` step in docs.yml on purpose; the two must stay in
      # step, because they are producing the same bundle for two different hosts.
      - name: Stage documents and images
        run: |
          cp -f img/*.png            serverpackcreator-help/Writerside/topics/img/ || true
          cp -f img/*.webp           serverpackcreator-help/Writerside/topics/img/ || true
          cp -f img/*.gif            serverpackcreator-help/Writerside/topics/img/ || true
          cp -f CHANGELOG.md         serverpackcreator-help/Writerside/topics/CHANGELOG.md
          cp -f CODE_OF_CONDUCT.md   serverpackcreator-help/Writerside/topics/CODE_OF_CONDUCT.md
          cp -f CONTRIBUTING.md      serverpackcreator-help/Writerside/topics/CONTRIBUTING.md
          cp -f HELP.md              serverpackcreator-help/Writerside/topics/HELP.md
          cp -f LICENSE              serverpackcreator-help/Writerside/topics/LICENSE.md
          cp -f README.md            serverpackcreator-help/Writerside/topics/README.md
          cp -f SECURITY.md          serverpackcreator-help/Writerside/topics/SECURITY.md

      # JetBrains' own action, rather than docs.yml's hand-rolled `docker run`. docs.yml needs the hand-rolled
      # form because its Forgejo runner puts the job in a container talking to a SIBLING daemon, where a
      # `-v "$PWD:..."` bind resolves on the daemon's filesystem and silently mounts an empty directory --
      # the build then exits 0 having produced nothing. GitHub's hosted runners have no job
      # container -- the daemon and the workspace are the same machine -- so an ordinary bind is correct here
      # and the supported action can be used. `location` points the builder at the help module.
      - name: Build the Writerside webhelp
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.INSTANCE }}
          docker-version: ${{ env.DOCKER_VERSION }}
          location: serverpackcreator-help
          artifact: ${{ env.ARTIFACT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Set Permissions
        run: chmod +x gradlew

      # `dokkaGenerateHtml` is the HTML publication -- what the live github.io site has always served, and a
      # different renderer from the Javadoc publication that `dokkaJavadocJar` packs for Maven Central.
      # The version is only meaningful on a tag; on `main` the project's own default is the honest answer,
      # and passing an empty one (the 8.x.x bug in the header) is worse than passing none.
      - name: Build the Kotlin API reference
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ./gradlew -Pversion="${{ github.ref_name }}" :serverpackcreator-api:dokkaGenerateHtml --full-stacktrace
          else
            ./gradlew :serverpackcreator-api:dokkaGenerateHtml --full-stacktrace
          fi

      # The same layout `docker/Dockerfile.help` produces: webhelp at the root, Dokka at `api/`. `spch.tree`
      # links to `api/index.html` RELATIVE to the site root, which is what makes one link serve both this
      # deployment (`/ServerPackCreator/api/`, a project subpath) and the container's (`/api/`). Verified by
      # serving the Dokka tree two levels deep: every asset on its deepest page resolves, because Dokka emits
      # `../../../../`-style paths and no root-absolute ones.
      # The `test -s`/`test -d` guards are the point of the step, and they are NOT belt-and-braces: the action
      # runs `helpbuilderinspect ... || true` and then fails only when the artifacts directory is entirely
      # EMPTY (read from its index.js at the pinned sha). A build that dies after emitting just `report.json`
      # therefore reports success, and without these guards the site would publish with no help in it.
      - name: Assemble the site
        run: |
          set -e
          test -s "artifacts/$ARTIFACT" || { echo "::error::Writerside produced no $ARTIFACT"; exit 1; }
          mkdir -p public
          unzip -O UTF-8 -qq "artifacts/$ARTIFACT" -d public
          test -d serverpackcreator-api/build/dokka || { echo "::error::Dokka produced no output"; exit 1; }
          cp -R serverpackcreator-api/build/dokka public/api
          test -s public/index.html
          test -s public/api/index.html
          echo "webhelp: $(find public -maxdepth 1 -type f | wc -l) files at root; dokka: $(find public/api -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Separate job because it is free: `deploy-pages` does not download the bundle, it tells Pages to publish
  # the artifact this run already uploaded. It needs no checkout and no JDK.
  deploy:
    name: "Deploy to Pages"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
