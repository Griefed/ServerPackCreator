name: Update README with blog posts and sponsors

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blog:
    runs-on: ubuntu-latest
    name: "Fetch and Generate Blog Posts"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Griefed/ServerPackCreator
          ref: main

      - uses: release-kit/hash-files@6437070e108606dfe7614a3ee4caabbb9168268d # v1
        id: get-current-hash
        with:
          patterns: |
            README.md
      - name: Current README hash
        run: echo ${{ steps.get-current-hash.outputs.hash }}

      - name: Add GitHub Sponsors to Readme
        uses: JamesIves/github-sponsors-readme-action@2fd9142e765f755780202122261dc85e78459405 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          active-only: false
          file: 'README.md'

      - uses: actions-cool/contributor-helper@4ae4f034d624fc63c70cc89af686a0fb80168e1d # v1.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          update-files: 'README.md'
          update-places: '<!-- contributors -->/<!-- contributors end -->'
          repo: 'Griefed/ServerPackCreator'
          show-total: false
          style: 'base'
          avatar-width: '70'

      - uses: release-kit/hash-files@6437070e108606dfe7614a3ee4caabbb9168268d # v1
        id: get-new-hash
        with:
          patterns: |
            README.md
      - name: New README hash
        run: echo ${{ steps.get-new-hash.outputs.hash }}

      - name: Push
        if: ${{ steps.get-current-hash.outputs.hash != steps.get-new-hash.outputs.hash }}
        # Secrets are passed via env (never interpolated into the command) and the GitLab token is
        # sent in an Authorization header rather than embedded in the push URL, so it can't leak into
        # logs/error traces. git is preinstalled on ubuntu-latest, so no apt-get is needed.
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_MAIL: ${{ secrets.GIT_MAIL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CI_SERVER_HOST: ${{ secrets.CI_SERVER_HOST }}
          CI_PROJECT_TITLE: ${{ secrets.CI_PROJECT_TITLE }}
        run: |
          git config user.name "$GIT_USER"
          git config user.email "$GIT_MAIL"
          git add README.md
          git commit -m 'chore: Update sponsors and contributors'
          auth=$(printf '%s:%s' "$GIT_USER" "$GITLAB_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: Basic ${auth}" \
            push "https://${CI_SERVER_HOST}/${GIT_USER}/${CI_PROJECT_TITLE}.git" HEAD:refs/heads/main
