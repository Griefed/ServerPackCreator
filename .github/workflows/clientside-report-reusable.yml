name: Clientside report (reusable)

# The pipeline behind clientside-verify.yml. `resolve` decides whether the event earns a boot; `report`
# builds ServerPackCreator from source, boots a server with the requested mod once per Minecraft line, and
# posts the verdicts -- with each boot's console -- as one issue-comment that later runs update in place.
# The GitHub-side logic lives in .github/scripts/clientside-verification.js, where Forgejo's test.yml runs it.
# Not triggered on its own.

on:
  workflow_call:
    inputs:
      issue_number:
        description: "The issue to report on."
        required: true
        type: string
    secrets:
      CURSEFORGE_API_KEY:
        description: "CurseForge API key; required only for CurseForge links."
        required: false

permissions:
  contents: read
  issues: write

jobs:
  # Cheap, and separate from the boot, because an `edited` event usually changes nothing a boot depends on
  # and must then neither boot nor cancel the boot already running -- so this job holds no concurrency group.
  resolve:
    name: Decide whether to boot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.resolve.outputs.verify }}
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Resolve the request
        id: resolve
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const verification = require('./.github/scripts/clientside-verification.js')
            await verification.resolve({ github, context, core, issueNumber: Number(process.env.ISSUE_NUMBER) })

  report:
    name: Clientside report
    needs: resolve
    if: needs.resolve.outputs.verify == 'true'
    runs-on: ubuntu-latest
    # Above the verification step's own budget, so a step that runs out of time still uploads its logs and
    # says so on the issue.
    timeout-minutes: 200
    # On this job, after `resolve`, so only a run that will boot can supersede another. A workflow-level group
    # is entered before any job's `if:` is evaluated: the `labeled` event the issue form fires beside `opened`
    # would cancel the boot and then skip itself.
    concurrency:
      group: clientside-report-${{ inputs.issue_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # Every Java a Minecraft release requires: 8 (up to 1.16), 16 (1.17), 17 (1.18 to 1.20.4) and 25 (26.x),
      # with 21 from the next step. start.sh boots only on the exact major, and -verifyclientside picks each
      # pack's JDK from the JAVA_HOME_<major>_<arch> variables this sets. These follow Mojang's per-version
      # requirement, not SPC's own target, so they do not move with a Java bump (misc/Java-References.md).
      - name: Set up the JDKs Minecraft servers need
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            8
            16
            17
            25

      # Installed last, so it stays the default `java` that Gradle and ServerPackCreator run on.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Set permissions
        run: chmod +x gradlew

      # Built from source (not a release) so the CLI verbs always match the current branch.
      - name: Build ServerPackCreator jar
        run: ./gradlew :serverpackcreator-app:bootJar --no-daemon

      # The engine's own worst case fits: five Minecraft lines, three boots each, twelve minutes per boot.
      - name: Run clientside verification
        timeout-minutes: 185
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PROJECT_URL: ${{ needs.resolve.outputs.url }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/spc-home"
          JAR=$(ls serverpackcreator-app/build/libs/serverpackcreator-app-*.jar | grep -vE 'plain|javadoc|sources' | head -n1)
          echo "Using jar: $JAR"
          java -jar "$JAR" \
            --home "$GITHUB_WORKSPACE/spc-home" \
            -verifyclientside "$PROJECT_URL" \
            --output "$GITHUB_WORKSPACE/clientside-report.md"

      # `boot/<attempt>/boot.log` is the console each verdict rests on, survivors included; `boot-evidence/`
      # keeps every attempt that did not survive -- console, the server's own logs, any crash report. SPC's own
      # log holds what never reached a console: staging refusals and generation errors.
      - name: Upload boot logs
        id: boot-logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: clientside-boot-logs
          path: |
            spc-home/work/clientside-verify/boot-evidence/**
            spc-home/work/clientside-verify/boot/**/boot.log
            spc-home/logs/**
          if-no-files-found: ignore

      # After a failed or timed-out verification too, so the issue says so. Not after a cancellation, which
      # only means a newer run superseded this one and will post instead.
      - name: Post report comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ARTIFACT_URL: ${{ steps.boot-logs.outputs.artifact-url }}
        with:
          script: |
            const verification = require('./.github/scripts/clientside-verification.js')
            await verification.postReport({
              github,
              context,
              issueNumber: Number(process.env.ISSUE_NUMBER),
              reportFile: process.env.GITHUB_WORKSPACE + '/clientside-report.md',
              artifactUrl: process.env.ARTIFACT_URL
            })
