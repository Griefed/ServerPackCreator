name: Clientside report (reusable)

# The pipeline behind clientside-verify.yml. `resolve` decides whether the event earns a boot; `report`
# builds ServerPackCreator from source and boots a server with the requested mod once per Minecraft line;
# `post` posts the verdicts -- with each boot's console -- as one issue-comment that later runs update in place.
#
# A boot runs the requested mod's code on the runner, so it is gated and contained:
# - `resolve` boots only on a maintainer's say-so (`bootAuthorised` in the script below).
# - `report` holds a read-only token that is not persisted into the checkout, never writes a cache, and keeps
#   the CurseForge key out of every environment while servers run (see the key's two steps).
# - `post`, which needs `issues: write`, runs no mod code.
# The runner user can `sudo`, so none of that contains a determined mod: the gate is the control, the rest
# removes what was reachable without trying. See .claude/rules/ci-workflows.md.
# The GitHub-side logic lives in .github/scripts/clientside-verification.js, where Forgejo's test.yml runs it.
# Not triggered on its own.

on:
  workflow_call:
    inputs:
      issue_number:
        description: "The issue to report on."
        required: true
        type: string
    secrets:
      CURSEFORGE_API_KEY:
        description: "CurseForge API key; required only for CurseForge links."
        required: false

permissions:
  contents: read
  issues: write

jobs:
  # Cheap, and separate from the boot, because an `edited` event usually changes nothing a boot depends on
  # and must then neither boot nor cancel the boot already running -- so this job holds no concurrency group.
  resolve:
    name: Decide whether to boot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.resolve.outputs.verify }}
      url: ${{ steps.resolve.outputs.url }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Resolve the request
        id: resolve
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const verification = require('./.github/scripts/clientside-verification.js')
            await verification.resolve({ github, context, core, issueNumber: Number(process.env.ISSUE_NUMBER) })

  report:
    name: Clientside report
    needs: resolve
    if: needs.resolve.outputs.verify == 'true'
    runs-on: ubuntu-latest
    # Above the verification step's own budget, so a step that runs out of time still uploads its logs and
    # says so on the issue.
    timeout-minutes: 200
    # On this job, after `resolve`, so only a run that will boot can supersede another. A workflow-level group
    # is entered before any job's `if:` is evaluated: the `labeled` event the issue form fires beside `opened`
    # would cancel the boot and then skip itself. Per issue; the gate in `resolve` is what bounds how many
    # issues can boot at once.
    concurrency:
      group: clientside-report-${{ inputs.issue_number }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.boot-logs.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every Java a Minecraft release requires: 8 (up to 1.16), 16 (1.17), 17 (1.18 to 1.20.4) and 25 (26.x),
      # with 21 from the next step. start.sh boots only on the exact major, and -verifyclientside picks each
      # pack's JDK from the JAVA_HOME_<major>_<arch> variables this sets. These follow Mojang's per-version
      # requirement, not SPC's own target, so they do not move with a Java bump (misc/Java-References.md).
      - name: Set up the JDKs Minecraft servers need
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            8
            16
            17
            25

      # Installed last, so it stays the default `java` that Gradle and ServerPackCreator run on.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true

      # Read-only: mod code runs in this job, and clientside-accept.yml (contents: write) must never restore
      # anything it could have written.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Set permissions
        run: chmod +x gradlew

      # Built from source (not a release) so the CLI verbs always match the current branch.
      - name: Build ServerPackCreator jar
        run: ./gradlew :serverpackcreator-app:bootJar --no-daemon

      # The key reaches the verification as a file, which it reads and deletes before its first boot
      # (`CurseForgeApiKey`), so no process environment holds it while a server runs. An absent secret writes
      # no file and CurseForge is simply not offered.
      - name: Hand the CurseForge key over in a file
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -n "$CURSEFORGE_API_KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/curseforge-api-key"
            printf '%s' "$CURSEFORGE_API_KEY" > "$RUNNER_TEMP/curseforge-api-key"
          fi

      # The engine's own worst case fits: five Minecraft lines, three boots each, twelve minutes per boot.
      - name: Run clientside verification
        timeout-minutes: 185
        env:
          CURSEFORGE_API_KEY_FILE: ${{ runner.temp }}/curseforge-api-key
          PROJECT_URL: ${{ needs.resolve.outputs.url }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/spc-home"
          JAR=$(ls serverpackcreator-app/build/libs/serverpackcreator-app-*.jar | grep -vE 'plain|javadoc|sources' | head -n1)
          echo "Using jar: $JAR"
          java -jar "$JAR" \
            --home "$GITHUB_WORKSPACE/spc-home" \
            -verifyclientside "$PROJECT_URL" \
            --output "$GITHUB_WORKSPACE/clientside-report.md"

      - name: Remove the CurseForge key file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/curseforge-api-key"

      # `boot/<attempt>/boot.log` is the console each verdict rests on, survivors included; `boot-evidence/`
      # keeps every attempt that did not survive -- console, the server's own logs, any crash report. SPC's own
      # log holds what never reached a console: staging refusals and generation errors.
      - name: Upload boot logs
        id: boot-logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: clientside-boot-logs
          path: |
            spc-home/work/clientside-verify/boot-evidence/**
            spc-home/work/clientside-verify/boot/**/boot.log
            spc-home/logs/**
          if-no-files-found: ignore

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: clientside-report
          path: clientside-report.md
          if-no-files-found: ignore

  # Separate from `report` so the token that may write to issues never shares a job with mod code. After a
  # failed or timed-out verification too, so the issue says so; not after a cancellation, which only means a
  # newer run superseded this one and will post instead.
  post:
    name: Post the report
    needs: [resolve, report]
    if: ${{ needs.report.result == 'success' || needs.report.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Absent when the verification wrote nothing; postReport then says so.
      - name: Download the report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: clientside-report

      - name: Post report comment
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ARTIFACT_URL: ${{ needs.report.outputs.artifact-url }}
        with:
          script: |
            const verification = require('./.github/scripts/clientside-verification.js')
            await verification.postReport({
              github,
              context,
              issueNumber: Number(process.env.ISSUE_NUMBER),
              reportFile: process.env.GITHUB_WORKSPACE + '/clientside-report.md',
              artifactUrl: process.env.ARTIFACT_URL
            })
