name: Clientside report (reusable)

# The pipeline behind clientside-verify.yml. `resolve` decides whether the event earns a boot; `report`
# builds the grinder from source and boots a server with the requested mod once per Minecraft line, inside
# the grinder's runtime container; `post` posts the verdicts -- with each boot's console -- as one
# issue-comment that later runs update in place.
#
# A boot runs the requested mod's code, so it is gated and contained:
# - `resolve` boots only on a maintainer's say-so (`bootAuthorised` in the script below).
# - `report` boots the mod in the grinder's container: `--network none`, every capability dropped,
#   `no-new-privileges`, a non-root user, no environment, and only the staged pack mounted. The runner's
#   memory, token, sudo and the CurseForge key are outside it. The job also holds a read-only token that is
#   not persisted into the checkout and a cache token that cannot save (`cache-mode: read`, also capped by
#   the caller), and hands the key over in a file the grinder deletes on reading it.
# - `post`, which needs `issues: write`, runs no mod code.
# See .claude/rules/ci-workflows.md for what is contained and what is not.
# The GitHub-side logic lives in .github/scripts/clientside-verification.js, where Forgejo's test.yml runs it.
# Not triggered on its own.

on:
  workflow_call:
    inputs:
      issue_number:
        description: "The issue to report on."
        required: true
        type: string
    secrets:
      CURSEFORGE_API_KEY:
        description: "CurseForge API key; required only for CurseForge links."
        required: false

permissions:
  contents: read
  issues: write

jobs:
  # Cheap, and separate from the boot, because an `edited` event usually changes nothing a boot depends on
  # and must then neither boot nor cancel the boot already running -- so this job holds no concurrency group.
  resolve:
    name: Decide whether to boot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.resolve.outputs.verify }}
      url: ${{ steps.resolve.outputs.url }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Resolve the request
        id: resolve
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const verification = require('./.github/scripts/clientside-verification.js')
            await verification.resolve({ github, context, core, issueNumber: Number(process.env.ISSUE_NUMBER) })

  report:
    name: Clientside report
    needs: resolve
    if: needs.resolve.outputs.verify == 'true'
    runs-on: ubuntu-latest
    # Above the image build's and the verification step's budgets combined, so a step that runs out of time
    # still uploads its logs and says so on the issue.
    timeout-minutes: 260
    # On this job, after `resolve`, so only a run that will boot can supersede another. A workflow-level group
    # is entered before any job's `if:` is evaluated: the `labeled` event the issue form fires beside `opened`
    # would cancel the boot and then skip itself. Per issue; the gate in `resolve` is what bounds how many
    # issues can boot at once.
    concurrency:
      group: clientside-report-${{ inputs.issue_number }}
      cancel-in-progress: true
    # The job's cache token itself cannot save, so neither can a mod that reads it out of the runner's memory.
    # `cache-read-only` below only stops setup-gradle's own save.
    cache-mode: read
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.boot-logs.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The JDK Gradle and the grinder run on. Servers boot on the JDKs inside the runtime image.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true

      # Read-only: mod code runs in this job, and clientside-accept.yml (contents: write) must never restore
      # anything it could have written.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Set permissions
        run: chmod +x gradlew

      # Built from source (not a release) so the grinder always matches the current branch.
      - name: Build the grinder
        run: ./gradlew :serverpackcreator-grinder:installDist --no-daemon

      # The image every loader install and mod boot runs in, built here because it is published nowhere. No
      # buildx cache: the job's cache token cannot save, by design.
      - name: Build the grinder's runtime image
        timeout-minutes: 30
        run: docker build -t spc-grinder-runtime:latest serverpackcreator-grinder/docker

      # The key reaches the grinder as a file, which it reads and deletes before its first boot
      # (`CurseForgeApiKey`), so no process environment holds it while a server runs. An absent secret writes
      # no file and CurseForge is simply not offered.
      - name: Hand the CurseForge key over in a file
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -n "$CURSEFORGE_API_KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/curseforge-api-key"
            printf '%s' "$CURSEFORGE_API_KEY" > "$RUNNER_TEMP/curseforge-api-key"
          fi

      # Five Minecraft lines, three boots each at twelve minutes, plus a loader install per line, which the
      # one-off networked install container runs from a vanilla pack without the mod.
      - name: Run clientside verification
        timeout-minutes: 215
        env:
          CURSEFORGE_API_KEY_FILE: ${{ runner.temp }}/curseforge-api-key
          SPC_GRINDER_HOME: ${{ github.workspace }}/grinder-home
          PROJECT_URL: ${{ needs.resolve.outputs.url }}
        run: |
          serverpackcreator-grinder/build/install/serverpackcreator-grinder/bin/serverpackcreator-grinder \
            --clientside-report "$PROJECT_URL" \
            --output "$GITHUB_WORKSPACE/clientside-report.md"

      - name: Remove the CurseForge key file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/curseforge-api-key"

      # `boot-logs/` is the grinder's boot-log store: every attempt that did not survive -- console, the
      # server's own logs, any crash report -- copied out of the staged pack. Nothing else from the pack leaves
      # the job: the mod could write anything there. The grinder's own log holds what never reached a console:
      # staging refusals, loader installs and generation errors.
      - name: Upload boot logs
        id: boot-logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: clientside-boot-logs
          path: |
            grinder-home/boot-logs/**
            grinder-home/logs/**
          if-no-files-found: ignore

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: clientside-report
          path: clientside-report.md
          if-no-files-found: ignore

  # Separate from `report` so the token that may write to issues never shares a job with mod code. After a
  # failed or timed-out verification too, so the issue says so; not after a cancellation, which only means a
  # newer run superseded this one and will post instead.
  post:
    name: Post the report
    needs: [resolve, report]
    if: ${{ needs.report.result == 'success' || needs.report.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Absent when the verification wrote nothing; postReport then says so.
      - name: Download the report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: clientside-report

      - name: Post report comment
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ARTIFACT_URL: ${{ needs.report.outputs.artifact-url }}
        with:
          script: |
            const verification = require('./.github/scripts/clientside-verification.js')
            await verification.postReport({
              github,
              context,
              issueNumber: Number(process.env.ISSUE_NUMBER),
              reportFile: process.env.GITHUB_WORKSPACE + '/clientside-report.md',
              artifactUrl: process.env.ARTIFACT_URL
            })
