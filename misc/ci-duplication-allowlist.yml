# Repeats that `misc/ci-duplication-check.py` must not flag, each with the reason it cannot be shared.
#
# The key is the fingerprint the check prints, which is a hash of the step's normalised body. That is
# deliberate: editing an allowlisted step changes its fingerprint and turns the check red again, so the
# exemption has to be re-argued rather than inherited. Run `--list` to get the new one.
#
# An entry here is a claim that sharing is IMPOSSIBLE or WORSE, not that nobody got round to it. A
# repeat that merely has not been dealt with yet belongs in the report, where it is visible.
#
# LANDMINE -- a change that touches every workflow at once re-keys every entry it touches, and the
# check then reports the SAME repeat twice: once as a stale entry and once as an unexplained
# duplicate. Three entries went that way unnoticed when the `uses:` references were converted from
# pinned SHAs to version tags, because that edit changed the body of every allowlisted step that
# carries a `uses:` -- and nothing caught it, because this check did not run in CI at the time. It
# does now (`test.yml`, *Verify the workflow conventions*), so the same sweep would fail the build
# instead. Re-key in the SAME commit as the sweep.

1dff9f0139e0: >-
  actions/checkout@v7 with fetch-depth: 0, in six jobs. Irreducible: a local composite action's own
  files arrive with the checkout, so the checkout can never be the thing inside one. Forgejo's own
  reference calls forgetting it "the most common mistake when using an action included in the
  repository under test".

de92b2337da4: >-
  The alpha/beta create-guard, in six jobs. A job-level `if:` decides whether a job is scheduled at
  all, and a composite action runs inside a job that has already been scheduled, so there is nowhere
  for it to live. It also varies where it is used: qodana's `notify` needs `always() && (...)` because
  `always()` would otherwise run it when the job it `needs` was skipped, and release-generate.yml adds
  a `RELEASE:` commit-message clause. A shared version with escape hatches for both is a guard nobody
  can evaluate by reading it.

80fcca20e6f9: >-
  test.yml's `Build image` and `Build image (retry)`, in its `docker` job. The retry exists to re-run the identical
  build after waiting out ghcr's burst limiter, so its inputs are the same BY DEFINITION -- a version
  that differed would not be a retry. See 3c3b829cfd54 for why the two files' retries are not shared
  with each other either.

3c3b829cfd54: >-
  release-build.yml's `Build and push` and `Build and push (retry)`. Same reason as 80fcca20e6f9. The
  pattern is deliberately NOT shared with test.yml's `docker` job: a composite would need six pass-through
  inputs (push, no-cache, platforms, build-args, tags, file) to share about 25 lines of shell, and the
  two differ in what they cost -- around 30 s there against roughly fifteen minutes here -- so a change
  made for one would be made blind to the other's consequences. Sharing it would also couple the
  release's image push to whatever lands in test.yml's image check.

07c2806dc83b: >-
  update-readme.yml hashes README.md before and after rewriting it. Two invocations of one action with
  the same inputs is what a before/after measurement IS; collapsing them would delete the measurement.

e8e7c95aa6dc: >-
  Downloading `release-assets`, in release-build.yml's `release`, `mirror` and `virustotal`. A step
  cannot be shared between JOBS except through a composite action, and a composite action's files
  arrive only with a checkout -- which `mirror` and `virustotal` do not have and need nothing else
  from. Sharing a four-line download would mean adding a clone of the repository to two jobs that
  consume an artifact and nothing else. Three consumers of one artifact each fetching it IS the
  mechanism; there is no shape with fewer copies.

eaa02ee3d83f: >-
  Downloading `gradle-jars`, in artifacts-reusable.yml's `appimage`, `winimage` and `media`. Same
  mechanism as e8e7c95aa6dc: one producer, three consumers, and a fan-out is what that looks like in
  YAML. The weaker of the two claims, because all three of these jobs DO check out -- so a composite
  is possible here, just worse: it would wrap a single `uses:` and move the pinned
  `download-artifact@v7` out of sight of the job that depends on it.
