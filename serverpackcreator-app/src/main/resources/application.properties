server.port=8080
server.error.whitelabel.enabled=false
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.file-date-format=_yyyy-MM-dd
server.tomcat.accesslog.prefix=tomcat_access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=common
spring.output.ansi.enabled=ALWAYS
server.error.include-message=ALWAYS
# NEVER, not ALWAYS: /api/v2/modpacks/upload has no authentication and @CrossOrigin("*"), so an
# unhandled exception handed the caller a stack trace with absolute server paths in it. The message
# is still included, because those are ours and are what the SPA shows the user.
server.error.include-stacktrace=NEVER
server.tomcat.keep-alive-timeout=600000
spring.servlet.multipart.enabled=true
spring.application.name=ServerPackCreator
# Deliberately left off: this property makes MongoTemplate create the @Indexed indexes during context
# refresh, which makes a reachable database a condition of starting up (measured: ~30s createIndexes
# wait, MongoTimeoutException, cancelled refresh). DeclaredIndexCreator creates them on
# ApplicationReadyEvent instead. Pinned by DeclaredIndexStartupTest.
# spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=5000MB
spring.servlet.multipart.max-request-size=5000MB
spring.config.import=classpath:/application.properties,classpath:/serverpackcreator.properties,optional:file:./serverpackcreator.properties,optional:file:./overrides.properties


