components:
  schemas:
    ZipResponse:
      type: object
      properties:
        message:
          type: string
        success:
          type: boolean
        modPackId:
          type:
          - string
          - "null"
        runConfigId:
          type:
          - string
          - "null"
        serverPackId:
          type:
          - string
          - "null"
        status:
          type:
          - string
          - "null"
          enum:
          - QUEUED
          - CHECKING
          - CHECKED
          - GENERATING
          - GENERATED
          - ERROR
      required:
      - message
      - success
    VersionMetaResponse:
      type: object
      properties:
        minecraft:
          type: array
          items:
            type: string
        fabric:
          type: array
          items:
            type: string
        legacyFabric:
          type: array
          items:
            type: string
        quilt:
          type: array
          items:
            type: string
        forge:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        neoForge:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - fabric
      - forge
      - legacyFabric
      - minecraft
      - neoForge
      - quilt
    AmountStatsData:
      type: object
      properties:
        modPacks:
          type: integer
          format: int32
        serverPacks:
          type: integer
          format: int32
        runConfigurations:
          type: integer
          format: int32
        minecraftVersions:
          type: object
          additionalProperties:
            type: integer
            format: int32
        modloaders:
          type: object
          additionalProperties:
            type: integer
            format: int32
        modloaderVersions:
          type: object
          additionalProperties:
            type: integer
            format: int32
      required:
      - minecraftVersions
      - modPacks
      - modloaderVersions
      - modloaders
      - runConfigurations
      - serverPacks
    AmountPerDate:
      type: object
      properties:
        creations:
          type: integer
          format: int32
        date:
          type: string
      required:
      - creations
      - date
    RunConfiguration:
      type: object
      properties:
        id:
          type:
          - string
          - "null"
        minecraftVersion:
          type: string
        modloader:
          type: string
        modloaderVersion:
          type: string
        startArgs:
          type: array
          items:
            type: string
        clientMods:
          type: array
          items:
            type: string
        whitelistedMods:
          type: array
          items:
            type: string
      required:
      - clientMods
      - minecraftVersion
      - modloader
      - modloaderVersion
      - startArgs
      - whitelistedMods
    ServerPack:
      type: object
      properties:
        id:
          type:
          - string
          - "null"
        modpackId:
          type: string
        size:
          type: integer
          format: int32
        downloads:
          type: integer
          format: int32
        confirmedWorking:
          type: integer
          format: int32
        dateCreated:
          type: string
          format: date-time
        fileID:
          type:
          - string
          - "null"
        fileName:
          type:
          - string
          - "null"
        sha256:
          type:
          - string
          - "null"
        runConfiguration:
          oneOf:
          - $ref: "#/components/schemas/RunConfiguration"
          - type: "null"
      required:
      - confirmedWorking
      - dateCreated
      - downloads
      - modpackId
      - size
    ServerPackDownload:
      type: object
      properties:
        downloadedAt:
          type: string
          format: date-time
        serverPack:
          $ref: "#/components/schemas/ServerPack"
      required:
      - downloadedAt
      - serverPack
    ModPack:
      type: object
      properties:
        id:
          type:
          - string
          - "null"
        projectID:
          type: string
        versionID:
          type: string
        dateCreated:
          type: string
          format: date-time
        name:
          type: string
        size:
          type: integer
          format: int32
        downloads:
          type:
          - integer
          - "null"
          format: int32
        status:
          type: string
          enum:
          - QUEUED
          - CHECKING
          - CHECKED
          - GENERATING
          - GENERATED
          - ERROR
        source:
          type: string
          enum:
          - ZIP
          - MODRINTH
          - CURSEFORGE
          - DIRECTORY
        fileID:
          type:
          - string
          - "null"
        sha256:
          type:
          - string
          - "null"
        serverPacks:
          type: array
          items:
            $ref: "#/components/schemas/ServerPack"
      required:
      - dateCreated
      - name
      - projectID
      - serverPacks
      - size
      - source
      - status
      - versionID
    ModPackDownload:
      type: object
      properties:
        downloadedAt:
          type: string
          format: date-time
        modPack:
          $ref: "#/components/schemas/ModPack"
      required:
      - downloadedAt
      - modPack
    DiskStatsData:
      type: object
      properties:
        identifier:
          type: string
        dirName:
          type: string
        rootName:
          type: string
        totalSpace:
          type: integer
          format: int64
        freeSpace:
          type: integer
          format: int64
        usedBySPC:
          type: integer
          format: int64
      required:
      - dirName
      - freeSpace
      - identifier
      - rootName
      - totalSpace
      - usedBySPC
    Settings:
      type: object
      properties:
        clientsideMods:
          type: array
          items:
            type: string
        whitelistMods:
          type: array
          items:
            type: string
        supportedModloaders:
          type: array
          items:
            type: string
        version:
          type: string
        devBuild:
          type: boolean
        directoriesToInclude:
          type: array
          items:
            type: string
        directoriesToExclude:
          type: array
          items:
            type: string
        zipArchiveExclusions:
          type: array
          items:
            type: string
        exclusionFilter:
          type: string
          enum:
          - START
          - END
          - CONTAIN
          - REGEX
          - EITHER
        isZipFileExclusionEnabled:
          type: boolean
        isAutoExcludingModsEnabled:
          type: boolean
        isMinecraftPreReleasesAvailabilityEnabled:
          type: boolean
        aikarsFlags:
          type: string
        language:
          type: string
      required:
      - aikarsFlags
      - clientsideMods
      - devBuild
      - directoriesToExclude
      - directoriesToInclude
      - exclusionFilter
      - isAutoExcludingModsEnabled
      - isMinecraftPreReleasesAvailabilityEnabled
      - isZipFileExclusionEnabled
      - language
      - supportedModloaders
      - version
      - whitelistMods
      - zipArchiveExclusions
    ErrorEntry:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    QueueEvent:
      type: object
      properties:
        id:
          type:
          - string
          - "null"
        modPackId:
          type:
          - string
          - "null"
        serverPackId:
          type:
          - string
          - "null"
        status:
          type:
          - string
          - "null"
          enum:
          - QUEUED
          - CHECKING
          - CHECKED
          - GENERATING
          - GENERATED
          - ERROR
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorEntry"
      required:
      - errors
      - message
      - timestamp
