# Log in to the two registries this repository publishes images to.
#
# THE GHCR USERNAME IS THE DOCKER HUB USERNAME, which looks like a copy-paste error and is not: the two
# accounts share a name, and ghcr authenticates the TOKEN, not the name beside it. Having that written
# once is most of the reason this action exists -- it was previously stated by two identical pairs of
# steps in two workflows, where correcting one would have left the other.
#
# A COMPOSITE ACTION CANNOT READ THE `secrets` CONTEXT, so all three arrive as inputs. They are still
# masked in the log, because masking is applied to the secret's value wherever it appears.
name: "Log in to the image registries"
description: "Authenticate to ghcr.io and Docker Hub for a job that pushes images."

inputs:
  dockerhub-user:
    description: "The Docker Hub account name, which is also the name ghcr is given."
    required: true
  dockerhub-token:
    description: "The Docker Hub access token."
    required: true
  ghcr-token:
    description: "The forge token ghcr authenticates with."
    required: true

runs:
  using: composite
  steps:
    - name: Log in to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.dockerhub-user }}
        password: ${{ inputs.ghcr-token }}

    # NO `registry:` HERE, and it is not an omission -- adding one for symmetry with the step above
    # breaks the push. Docker Hub is the one registry whose credentials are filed under a canonical
    # key, `https://index.docker.io/v1/`, rather than under its hostname, and `docker login` rewrites
    # the server address to that key only when the argument is empty or exactly `docker.io`. Passing
    # `index.docker.io` files the credential under that hostname, buildkit looks Docker Hub up under
    # the canonical key for host `registry-1.docker.io`, finds nothing, and pushes anonymously --
    # Docker Hub then answers `insufficient_scope: authorization failed` on a step whose login
    # reported success moments earlier. The tell in a build log is the ABSENCE of an
    # `[auth] <repo>:pull,push token for registry-1.docker.io` line. ghcr.io is an ordinary host and
    # does take `registry:`.
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-user }}
        password: ${{ inputs.dockerhub-token }}
