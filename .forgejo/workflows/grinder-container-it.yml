# The grinder's container integration tests, alone on the runner's Docker daemon.
#
# They are not in `test.yml` for one reason: `reapsALabelledOrphanLeftByAPreviousProcess` removes every
# grinder-labelled container on the daemon, because an orphan is a container whose maker is gone and the
# daemon cannot say who is gone. That side effect is not scopeable, so the only defence is exclusivity --
# and `test.yml` cannot provide it. Its concurrency group is per-ref, so a new push cancels its own
# outdated run but not a run of another ref, and two branches pushed close together share the runner and
# its daemon.
#
# Making `test.yml` itself repo-wide-exclusive would fix that and cost every push a second full 35-minute
# run in series. This file leaves `test.yml`'s cancellation alone and holds its lock for one job instead.
# **How long that lock is held has not been measured on the runner.** The tests are ~40 s locally; the job
# around them also checks out, provisions a JDK, resolves Gradle and compiles `-api`, `-clientside` and the
# grinder, and only a real run can say what that costs here. If it turns out to be long enough to matter,
# the lever is this job's scope, not the lock.
name: Grinder Container IT

# NO `pull_request:` TRIGGER. Every PR on this instance is opened from a branch of this repository, and
# `push:` already builds those commits, so adding it would run this workflow twice per push for a second
# verdict on the same tree, in parallel, on one runner.
#
# Two things that costs: the *merge* result is not built on its own, so a PR green on its head can still
# conflict semantically with its base until the merge lands and is built there; and a fork PR gets no
# Forgejo CI, which `.github/workflows/test.yml` covers instead -- GitHub is where a fork arrives.
on:
  push:
  workflow_dispatch:

# NO ref in the group, and that is the whole point of this file: one run of these tests at a time across
# the entire repository, whatever branch asked for it. `cancel-in-progress: false` queues rather than
# cancels -- Forgejo runs "any previous invocation of any workflow in the repository with the same
# concurrency group ... before the newer invocation". Exact ordering is documented as not guaranteed,
# which is fine: what is needed here is mutual exclusion, not FIFO.
concurrency:
  group: grinder-container-it
  cancel-in-progress: false

jobs:
  containers:
    name: "containers"
    runs-on: ubuntu-latest
    # Skip the push that *creates* `alpha`/`beta`: Forgejo fires `push` for a new ref as well as
    # `create`, and such a branch carries main's state, which `main` has already tested. On a new ref
    # `github.event.before` is the all-zero object id — Forgejo's push payload has no `created` field,
    # so GitHub's `github.event.created == false` cannot be used here. See .claude/rules/ci-workflows.md.
    if: ${{ github.event_name != 'push' || !(startsWith(github.event.before, '0000000000000000') && (github.ref_name == 'alpha' || github.ref_name == 'beta')) }}
    steps:

      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: wrapper

      - name: Set Permissions
        run: chmod +x gradlew

      # Pulled up front so the pull is not inside a test's own timeout.
      - name: Pull the image the container tests boot
        run: docker pull busybox:latest

      # Only these two classes. Everything else in the module is offline and already runs in `test.yml`;
      # running it again here would pay for it twice and, worse, would make this job long enough that
      # holding the repository-wide lock actually costs something.
      - name: Run the container integration tests
        env:
          GRINDER_DOCKER_IT: "1"
        run: >
          ./gradlew :serverpackcreator-grinder:test
          --tests "*DockerJavaContainerEngineIT*"
          --tests "*ContainerOwnershipIT*"

      # The failure mode this whole file exists to avoid is silence, and moving the gate out of `test.yml`
      # introduced a new way to be silent: if `GRINDER_DOCKER_IT` ever stops reaching the JVM, every one of
      # these tests SKIPS and the job goes green having verified nothing. So the job reads its own results
      # and fails on a skip, or on results that are not there at all.
      #
      # Python rather than grep: the first version of this step counted matching *lines* with `grep -c`
      # across a glob, and reported `ran=1 skipped=0` and exit 0 while both of its greps were failing with
      # "No such file or directory" — a verification step that passed having verified nothing, which is
      # precisely the bug it was written to prevent. The suite attributes are exact and an absent file
      # raises instead of vanishing.
      - name: Prove the tests ran rather than skipped
        if: ${{ always() }}
        run: |
          python3 - <<'PROOF'
          import glob, sys, xml.etree.ElementTree as ElementTree

          results = "serverpackcreator-grinder/build/test-results/test"
          reports = sorted(
              glob.glob(f"{results}/TEST-*DockerJavaContainerEngineIT.xml")
              + glob.glob(f"{results}/TEST-*ContainerOwnershipIT.xml")
          )
          if len(reports) != 2:
              print(f"::error::Expected both container suites to report; found {[r.split('/')[-1] for r in reports]}")
              sys.exit(1)

          ran = skipped = 0
          for report in reports:
              suite = ElementTree.parse(report).getroot()
              ran += int(suite.get("tests", "0"))
              skipped += int(suite.get("skipped", "0"))

          print(f"container tests: {ran}, of which skipped: {skipped}")
          if ran < 10 or skipped:
              print("::error::The container tests did not run. Did GRINDER_DOCKER_IT reach the JVM, and was a daemon reachable?")
              sys.exit(1)
          PROOF

      - name: Upload test results
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5, Forgejo's GHES-patched fork
        if: ${{ always() }}
        with:
          name: grinder-container-it-results
          path: serverpackcreator-grinder/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
