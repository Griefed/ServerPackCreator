# Phase 2 of releasing: everything a tag implies -- the jars, the AppImages, the install4j media, the
# signed Maven publication, the Docker images, the release itself and its announcement.
#
# Forgejo is the origin of the release; the mirror job at the end pushes it outward.
name: Build Release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: "Preparations"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # This job needs no source of its own -- it reads a ref name. The checkout is here because a
      # LOCAL action's files arrive with the checkout, and the alternative is a second copy of the
      # version rules. A shallow clone is enough: `tag` mode runs no git command.
      - uses: actions/checkout@v6

      # The tag *is* the version: .releaserc.yml uses `tagFormat: '${version}'`, no `v` prefix.
      # Anything not matching the two release shapes is refused rather than half-released.
      - name: Determine version
        id: v
        uses: ./.forgejo/actions/resolve-version
        with:
          mode: tag

  # The one artifact that cannot be produced on any runner already in this pool. jpackage CANNOT
  # CROSS-COMPILE (JEP 392, explicit non-goal), so a Windows app-image is built on Windows -- unlike the
  # AppImages, which `assets` cross-packages from its amd64 runner because an AppImage is a tarball plus
  # a prebuilt runtime stub and nothing arch-specific executes.
  #
  # LANDMINE -- a `:host`-scheme Windows runner is a HOST prerequisite; see claude-docs/WINDOWS-RUNNER.md.
  # Without one this job does not fail, it QUEUES on "No matching online runner with label", and
  # `release` needs it, so the release would hang rather than go red. Register the runner first.
  #
  # x86_64 ONLY, deliberately. A Windows ARM64 artifact needs a native ARM64 Windows runner, and the only
  # way to host one here is an emulated guest, whose throughput is not fit to gate a release on. Windows
  # on ARM64 runs x86_64 binaries, so that audience is served by this artifact.
  winimage:
    name: "Windows app-image"
    # AFTER `assets`, not beside it, so the jar INSIDE the image is byte-identical to the jar the
    # release ships. Building it again here would be a second build of the same tag -- functionally the
    # same jar and not the same bytes, and "the Windows artifact contains a different build" is exactly
    # the kind of claim nobody can check later. It also keeps the frontend's npm build off a Windows
    # runner, which is a failure surface this repository has never exercised.
    needs: [prepare, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      # The JDK jpackage comes from, and whose runtime it embeds into the image. No Gradle here: the jar
      # arrives from `assets` below.
      # `gradle: false` -- jpackage comes from the JDK and nothing here runs Gradle, so the dependency
      # cache would be restored and saved for a job that never resolves a dependency.
      - uses: ./.forgejo/actions/setup-build
        with:
          gradle: "false"

      - uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: release-assets
          path: assets

      # `Collect files` renamed it to `ServerPackCreator-<version>.jar`, and the release directory also
      # holds the api jar, the plugin jars and the dokka zip -- so the name is spelled out rather than
      # globbed, and checked, because picking the wrong jar produces an image that launches nothing.
      - name: Locate the released app jar
        id: jar
        # `powershell`, NOT `pwsh`. PowerShell 7 is a separate install that Windows does not ship and the
        # runner guest does not have, so `shell: pwsh` fails before the step runs with
        # `Cannot find: pwsh in PATH`. `powershell` is Windows PowerShell 5.1, present on every Windows
        # host, and everything below plus build-winimage.ps1 is written to its dialect.
        shell: powershell
        run: |
          $jar = "assets/ServerPackCreator-${{ needs.prepare.outputs.version }}.jar"
          if (-not (Test-Path $jar)) {
            Write-Output "::error::$jar is not among the release assets"
            Get-ChildItem assets | ForEach-Object { Write-Output "  $($_.Name)" }
            exit 1
          }
          # LANDMINE -- a step output written with `Out-File` arrives EMPTY, from a step that stays
          # GREEN. Windows PowerShell 5.1 defaults `Out-File` (and `>`/`>>`) to UTF-16LE, and its
          # `-Encoding utf8` -- the workaround GitHub's own documentation gives -- emits UTF-8 WITH a
          # byte-order mark. The Forgejo runner's env-file parser (`act/container/parse_env_file.go`)
          # splits each line on the first `=` with no encoding or BOM handling whatsoever, so both
          # spellings store a key that is not `path` and the consuming step reads an empty string.
          # UTF-8 with no BOM is the only encoding that works.
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "path=$jar`n", $utf8NoBom)

      # Resolved by glob, never spelled out: `misc/build-winimage.ps1` owns the filename including
      # `_experimental`, the same arrangement `misc/build-appimage.sh` has, and a copy here is a copy
      # that goes stale the next time it changes.
      - name: Build the Windows app-image
        shell: powershell
        run: |
          misc/build-winimage.ps1 -Version "${{ needs.prepare.outputs.version }}" -Arch ${{ matrix.arch }} -JarPath "${{ steps.jar.outputs.path }}"
          # @() so a single match is still an array: unwrapped, 5.1 hands back a bare FileInfo.
          $image = @(Get-ChildItem "ServerPackCreator-*-Windows-${{ matrix.arch }}_experimental.zip")
          if ($image.Count -ne 1) { Write-Output "::error::expected 1 Windows app-image, found $($image.Count)"; exit 1 }
          Write-Output "Produced $($image[0].Name) ($([math]::Round($image[0].Length / 1MB, 1)) MB)"
          # A per-artifact `.sha256` beside the zip, the same way devbuild.yml's jobs publish theirs.
          # `assets` has already written checksum.txt by the time this job runs -- that is the price of
          # taking the RELEASED jar rather than building a second one here -- so these two artifacts
          # carry their own, and nothing claims a coverage it does not have.
          $hash = (Get-FileHash $image[0].FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline "$($image[0].Name).sha256" "$hash  $($image[0].Name)"

      - name: Upload the Windows app-image
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: winimage-${{ matrix.arch }}
          path: |
            ServerPackCreator-*-Windows-${{ matrix.arch }}_experimental.zip
            ServerPackCreator-*-Windows-${{ matrix.arch }}_experimental.zip.sha256
          if-no-files-found: error

  assets:
    name: "JARs, media and checksums"
    needs: prepare
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - uses: ./.forgejo/actions/setup-build

      # The one action deliberately fetched from GitHub rather than a Forgejo mirror: install4j has no
      # equivalent there. Requires the instance to permit github.com actions; if it does not, install4j
      # must be pre-installed on the runner and this step replaced by nothing.
      - uses: https://github.com/luangong/setup-install4j@v1
        with:
          version: '13.1'
          license: ${{ secrets.INSTALL4J_LICENSE }}

      - name: Remove install4j script
        run: rm -f install4j_linux-x64_*.sh

      # Tests already ran on the commit this tag points at, so they are skipped here -- same exclusions
      # GitLab's `Build Release` used.
      - name: Build release
        run: |
          ./gradlew -Pversion="${{ needs.prepare.outputs.version }}" generateLicenseReport --info --full-stacktrace
          ./gradlew -Pversion="${{ needs.prepare.outputs.version }}" build --info --full-stacktrace \
            -x :serverpackcreator-api:test -x :serverpackcreator-app:test
          ./gradlew -Pversion="${{ needs.prepare.outputs.version }}" media --info --full-stacktrace \
            -x :serverpackcreator-api:test -x :serverpackcreator-app:test
          ./gradlew -Pversion="${{ needs.prepare.outputs.version }}" :serverpackcreator-api:dokkaGenerateHtml --info

      # Built here rather than in jobs of their own: the app jar they package is already in this
      # workspace, so separate jobs would mean uploading and re-downloading ~80 MB to gain nothing.
      # devbuild.yml splits them only because its jar arrives as an artifact regardless.
      #
      # BOTH are produced on this amd64 runner. The aarch64 one is cross-packaged -- nothing aarch64 has
      # to execute, because the JDK is merely unpacked and appimagetool runs as the host's architecture
      # while ARCH tells it which runtime to embed. That is the same reason devbuild.yml's aarch64 job
      # does not need an arm runner label, which no registered runner offers.
      #
      # Two sequential runs in one workspace are safe: the script `rm -rf`s its AppDir before each build
      # and keeps per-architecture JDK directories (`jdk-<major>-<arch>`, from its own JDK_VERSION), so the second
      # cannot inherit the first's runtime. Run before `Collect files`, which renames the app jar.
      - name: Build AppImages
        run: |
          V="${{ needs.prepare.outputs.version }}"
          chmod +x misc/build-appimage.sh
          misc/build-appimage.sh --update-channel latest "$V"
          misc/build-appimage.sh --arch aarch64 --update-channel latest "$V"
          # Anchored on the product name: appimagetool-<arch>.AppImage is downloaded into this same
          # directory, so a bare *.AppImage would count it. Two, no more and no fewer, or stop.
          #
          # Both invocations share one workspace, native architecture first:
          #   produced   ServerPackCreator-<version>-aarch64_experimental.AppImage  -> ELF 64-bit, ARM aarch64
          #              ServerPackCreator-<version>-x86_64_experimental.AppImage   -> ELF 64-bit, x86-64
          #              appimagetool-aarch64.AppImage                              <- the tool itself
          #   ServerPackCreator-* matches 2; a bare *.AppImage matches 3.
          # The JDK is unpacked per architecture (jdk-<major>-<arch>), so the second run cannot
          # inherit the first one's runtime.
          COUNT="$(ls -1 ServerPackCreator-*.AppImage 2>/dev/null | wc -l)"
          if [ "$COUNT" -ne 2 ]; then
            echo "::error::Expected 2 AppImages, found $COUNT"
            ls -la *.AppImage 2>/dev/null || echo "none at all"
            exit 1
          fi
          ls -lh ServerPackCreator-*.AppImage

      - name: Collect files
        run: |
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p "release/$V"
          mv "serverpackcreator-app/build/libs/serverpackcreator-app-$V.jar" \
             "serverpackcreator-app/build/libs/ServerPackCreator-$V.jar"
          cp serverpackcreator-api/build/libs/*.jar            "release/$V/"
          cp serverpackcreator-app/build/libs/*.jar            "release/$V/"
          cp media/*                                          "release/$V/"
          # Every plugin module, by glob rather than by name: the modules are already listed in
          # settings.gradle.kts and in the root build's `appPluginConfigurations`, and a third list here
          # is the one that silently stops growing -- which is exactly what happened while this line
          # named `-plugin-example` alone and three more plugins existed. `_experimental` is decided by
          # `serverpackcreator.plugin-conventions` and nothing here repeats it, the same arrangement the
          # AppImages have below.
          #
          # The count is derived, not written down, so it cannot go stale either: one jar per plugin
          # module, no more and no fewer. Fewer means a module whose jar did not build or did not get
          # the name; more means a stale jar from an earlier build, which a release workspace should
          # never have and which would ship twice if it did.
          PLUGIN_MODULES="$(ls -d serverpackcreator-plugin-*/ | wc -l)"
          PLUGIN_JARS="$(ls -1 serverpackcreator-plugin-*/build/libs/*_experimental.jar 2>/dev/null | wc -l)"
          if [ "$PLUGIN_JARS" -ne "$PLUGIN_MODULES" ]; then
            echo "::error::Expected one _experimental jar per plugin module ($PLUGIN_MODULES), found $PLUGIN_JARS"
            ls -la serverpackcreator-plugin-*/build/libs/ 2>/dev/null || echo "no plugin build directories at all"
            exit 1
          fi
          cp serverpackcreator-plugin-*/build/libs/*_experimental.jar "release/$V/"
          # The AppImages carry `_experimental` in their names -- `misc/build-appimage.sh` decides that,
          # and nothing here repeats it. They land in the release directory before checksum.txt is
          # generated below, so they are covered by it like every other asset.
          cp ServerPackCreator-*.AppImage                     "release/$V/"
          # The `.zsync` files the AppImages advertise. `gh-releases-zsync` resolves them out of the
          # release the AppImage came from, so an AppImage published without its `.zsync` carries an
          # update route that is dead on arrival -- and says nothing about it until a user tries.
          # Counted like the AppImages, and for the same reason: one per architecture or stop.
          ZSYNCS="$(ls -1 ServerPackCreator-*.AppImage.zsync 2>/dev/null | wc -l)"
          if [ "$ZSYNCS" -ne 2 ]; then
            echo "::error::Expected 2 .zsync files beside the AppImages, found $ZSYNCS"
            ls -la ServerPackCreator-*.AppImage* 2>/dev/null || echo "none at all"
            exit 1
          fi
          cp ServerPackCreator-*.AppImage.zsync               "release/$V/"
          rm -f "release/$V/output.txt" "release/$V/"*plain.jar
          # The Dokka HTML reference ships as a release asset.
          if [ -d serverpackcreator-api/build/dokka ]; then
            (cd serverpackcreator-api/build/dokka && zip -qr "$GITHUB_WORKSPACE/release/$V/serverpackcreator-api-$V-dokka-html.zip" .)
          fi
          # Into a temp file first: `sha256sum * > checksum.txt` has the shell create the (empty) target
          # before the glob expands, so the file would checksum itself.
          (cd "release/$V" && sha256sum * > ../checksum.txt && mv ../checksum.txt checksum.txt)
          ls -lh "release/$V"

      - name: Upload release assets
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: release-assets
          path: release/${{ needs.prepare.outputs.version }}/*
          if-no-files-found: error

  release:
    name: "Forgejo release"
    needs: [prepare, assets, winimage]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:

      - uses: actions/checkout@v6

      - uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: release-assets
          path: assets

      # Beside the `release-assets` above, not inside it: `winimage` runs AFTER `assets` so the jar it
      # packages is the released one, which means its output cannot be part of that artifact. Every
      # consumer of the asset set therefore merges it in the same way; see claude-docs/WINDOWS-RUNNER.md.
      - uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          pattern: winimage-*
          merge-multiple: true
          path: assets

      # Extracted from CHANGELOG.md rather than through a marketplace action: semantic-release has just
      # written the section for this version, and awk needs no dependency that has to resolve.
      - name: Extract changelog section
        run: |
          V="${{ needs.prepare.outputs.version }}"
          # The closing bracket is REQUIRED. With `\]?` optional, a request for `8.1.1` also matched
          # `## [8.1.1-beta.2](...)`; that rule ends in `next`, so the exit rule never
          # fired and collection ran on through every prerelease section beneath the release. Measured on
          # this repository's CHANGELOG: 8.1.1 gave 5,685 chars against a true section of 2,834, and 8.1.0
          # gave 28,807 against 14,377. Prereleases were unaffected, which is why it would have shipped.
          # LANDMINE - escaping the dots in the SHELL does not work, and every release log says so with
          # a gawk warning that the escape sequence was treated as a plain dot. awk processes escape
          # sequences in a -v assignment, so a shell-escaped 9\.0\.0-beta\.1 arrives inside the program
          # as 9.0.0-beta.1 and the dots have been wildcards all along, whatever the comment claimed.
          # Escape them inside awk instead, and as [.] rather than a backslash: POSIX leaves a backslash
          # in a gsub replacement undefined for anything but & and \\, and gawk bears that out - the
          # program-text replacement "\\\\." yields two backslashes and the regex then matches nothing.
          awk -v ver="$V" '
            BEGIN { esc = ver; gsub(/\./, "[.]", esc); section = "^#+ +\\[" esc "\\]" }
            $0 ~ section { found=1; next }
            found && /^#+ +\[[0-9]+\.[0-9]+\.[0-9]+/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release $V" > notes.md
          fi
          head -40 notes.md

      - name: Create release and upload assets
        id: create
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
          API: https://git.griefed.de/api/v1/repos/Griefed/ServerPackCreator
        run: |
          set -eu
          V="${{ needs.prepare.outputs.version }}"
          PRE="${{ needs.prepare.outputs.prerelease }}"
          # LANDMINE - the release body NEVER travels as a curl argument. Linux caps a SINGLE argv
          # entry at MAX_ARG_STRLEN (32 * PAGE_SIZE = 131,072 bytes) independently of ARG_MAX, so
          # `-d "{...,\"body\":$BODY,...}"` dies at execve with `/usr/bin/curl: Argument list too long`
          # once the notes get big -- and they do: a beta or final release aggregates every prerelease
          # section since the last stable one, which takes the payload past 200 kB where a prerelease sits
          # around 75 kB. Inlined, that is exit 126 "Argument list too long" before curl is ever exec'd;
          # `-d @file` runs and reaches the network. Both branches below therefore write a file.
          RELEASE_VERSION="$V" RELEASE_PRERELEASE="$PRE" python3 -c "import json,os;print(json.dumps({'tag_name':os.environ['RELEASE_VERSION'],'name':os.environ['RELEASE_VERSION'],'body':open('notes.md').read(),'draft':False,'prerelease':os.environ['RELEASE_PRERELEASE']=='true'}))" > create.json
          # Reuse an existing release for this tag instead of failing. Re-running this workflow is the
          # ordinary way to repair a release whose `maven` or `docker` job failed, and with `set -eu` an
          # unconditional POST would die here on the second attempt -- leaving the very jobs that need
          # repairing (`mirror`, `virustotal`, both of which need this id) skipped.
          ID="$(curl -s "$API/releases/tags/$V" -H "Authorization: token $TOKEN" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('id') or '')" 2>/dev/null || true)"
          if [ -n "$ID" ]; then
            echo "Release for $V already exists ($ID) - reusing it and refreshing its notes"
            python3 -c "import json;print(json.dumps({'body':open('notes.md').read()}))" > patch.json
            STATUS="$(curl -sS -o patched.json -w '%{http_code}' -X PATCH "$API/releases/$ID" \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @patch.json)"
            if [ "$STATUS" -ge 400 ]; then
              echo "::error::Forgejo returned HTTP $STATUS refreshing the notes of release $ID"
              cat patched.json
              exit 1
            fi
          else
            STATUS="$(curl -sS -o created.json -w '%{http_code}' -X POST "$API/releases" \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @create.json)"
            if [ "$STATUS" -ge 400 ]; then
              echo "::error::Forgejo returned HTTP $STATUS creating release $V"
              cat created.json
              exit 1
            fi
            ID="$(python3 -c 'import json;print(json.load(open("created.json"))["id"])')"
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          # Names already attached, because Forgejo does NOT enforce uniqueness: CreateReleaseAttachment
          # hands the name straight to UploadAttachment with no existence check (only `Title` is ever
          # truncated, at 255 characters). So an unguarded re-run does not fail on a duplicate -- it
          # silently attaches a SECOND copy of all twelve assets, which is worse, and this step's own
          # comment above invites exactly that re-run as the ordinary repair. The `mirror` job has always
          # guarded its loop this way; this is the one that publishes the canonical release catching up.
          curl -sS "$API/releases/$ID/assets" -H "Authorization: token $TOKEN" \
            | python3 -c "import json,sys;print('\n'.join(a['name'] for a in json.load(sys.stdin)))" > have.txt
          for f in assets/*; do
            NAME="$(basename "$f")"
            if grep -qxF "$NAME" have.txt; then
              echo "Forgejo already has $NAME - skipping"
              continue
            fi
            echo "Uploading $NAME"
            STATUS="$(curl -sS -o upload.json -w '%{http_code}' -X POST "$API/releases/$ID/assets?name=$NAME" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f")"
            if [ "$STATUS" -ge 400 ]; then
              echo "::error::Forgejo returned HTTP $STATUS uploading $NAME to release $ID"
              cat upload.json
              exit 1
            fi
          done

  maven:
    name: "Publish Maven"
    needs: [prepare, assets]
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - uses: ./.forgejo/actions/setup-build

      # One job where GitLab had five (sign + four publishes). They shared everything but the target and
      # each rebuilt the same artifacts; sequencing them here keeps that work once.
      # `-Psigning*` matches serverpackcreator.publishing-conventions, which reads them as properties.
      - name: Sign and publish
        env:
          GITHUB_ACTOR: ${{ secrets.GH_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITLABCOM_TOKEN: ${{ secrets.GITLABCOM_TOKEN }}
          # The SECRETS are FJ_*, the ENV VARS are FORGEJO_*, and the mismatch is deliberate. Forgejo
          # rejects any secret or variable whose name starts with FORGEJO_, GITEA_ or GITHUB_, so
          # `FORGEJO_TOKEN` cannot be created -- and that name is already taken by the automatic
          # per-job token, which is repo-scoped and cannot write to the package registry. Same reason
          # GH_ACTOR/GH_TOKEN are not GITHUB_*. The env-var names must stay FORGEJO_*, because
          # serverpackcreator.publishing-conventions reads them with System.getenv.
          FORGEJO_ACTOR: ${{ secrets.FJ_ACTOR }}
          FORGEJO_TOKEN: ${{ secrets.FJ_TOKEN }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
          # The signing key travels as an ORG_GRADLE_PROJECT_ variable, NOT as `-PsigningKey=...`.
          # `findProperty("signingKey")` in publishing-conventions reads either, and an armoured PGP key is
          # multi-line: spliced into a shell variable and word-split into gradle arguments, it is truncated
          # at the first newline, so `useInMemoryPgpKeys` gets a fragment. It also keeps the private key out
          # of the process argument list, where anything able to read /proc/<pid>/cmdline could see it.
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          V="${{ needs.prepare.outputs.version }}"
          COMMON="-Pversion=$V"
          SKIP="-x :serverpackcreator-api:test -x :serverpackcreator-app:test"
          # NAME THE PROJECT. `dokkaJavadocJar` without a path runs in all seven, so the docs of six modules
          # that are never published would gate the one publish that matters -- a module missing its
          # `module.md` is enough to kill the release. Only `-api` is published, and its own
          # `signMavenJavaPublication` already `dependsOn(dokkaJavadocJar)`.
          ./gradlew :serverpackcreator-api:dokkaJavadocJar :serverpackcreator-api:signMavenJavaPublication $COMMON $SKIP --info --stacktrace
          ./gradlew :serverpackcreator-api:publishMavenJavaPublicationToGitGriefedRepository    $COMMON $SKIP --info --stacktrace
          ./gradlew :serverpackcreator-api:publishMavenJavaPublicationToGitHubPackagesRepository $COMMON $SKIP --info --stacktrace
          ./gradlew :serverpackcreator-api:publishMavenJavaPublicationToGitLabRepository        $COMMON $SKIP --info --stacktrace
          ./gradlew :serverpackcreator-api:publishToSonatype closeAndReleaseSonatypeStagingRepository $COMMON $SKIP --info --stacktrace

  docker:
    name: "Docker images"
    needs: prepare
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # The registry caches are HOST configuration (claude-docs/RUNNER-REGISTRY-CACHE.md), and this step
      # must work whether or not they are up.
      #
      # They are addressed by IP because jobs here run inside a `docker:dind` daemon while the caches are
      # containers of the host daemon. dind's embedded DNS does not know them, so a service name cannot
      # resolve; routing does reach them, because `docker_dind` is attached to the cache network and its
      # children egress through that interface.
      #
      # The probe asks the question that decides the outcome -- can this job reach the cache -- rather
      # than a proxy for it. A job container and the buildx builder are both children of the same dind
      # daemon, so a `GET /v2/` from here takes the path the builder will take. A registry whose cache
      # does not answer is simply left out of the config and pulled from upstream.
      #
      # No `driver-opts: network=...`: with fixed IPs the builder has no network to join, and naming one
      # the daemon does not know is a hard failure before a single layer is pulled --
      #   ERROR: Error response from daemon: failed to set up container networking:
      #          network <name> not found
      - name: Point BuildKit at the host's registry caches when they answer
        id: regcache
        env:
          # Pinned by the runner host's compose file -- claude-docs/RUNNER-REGISTRY-CACHE.md section 1.
          # If these drift from the host, nothing breaks: the probe finds nothing and the build goes
          # upstream. That fail-soft is deliberate; a wrong address must never be a failed build.
          GHCR_CACHE: "172.31.77.6:5000"
          DOCKERHUB_CACHE: "172.31.77.5:5000"
        run: |
          set -eu
          toml="${RUNNER_TEMP:-/tmp}/buildkitd.toml"
          : > "$toml"

          # The second stanza per registry is not optional and is not obvious: `newMirrorRegistryHost`
          # defaults a mirror to https, and `fillInsecureOpts` looks the mirror's own scheme up under a
          # top-level [registry."<host:port>"] section. Without it buildkit dials https, fails the
          # handshake, falls back to upstream -- and silently does nothing at all.
          add_mirror() {
            upstream="$1"
            cache="$2"
            if curl -fsS --max-time 5 "http://${cache}/v2/" >/dev/null 2>&1; then
              printf '[registry."%s"]\n  mirrors = ["%s"]\n[registry."%s"]\n  http = true\n' \
                "$upstream" "$cache" "$cache" >> "$toml"
              echo "${upstream}: the cache at ${cache} answered /v2/ - BuildKit will pull through it."
            else
              echo "::notice::${upstream}: nothing answered /v2/ at ${cache} - pulling from upstream. See claude-docs/RUNNER-REGISTRY-CACHE.md."
            fi
          }

          add_mirror ghcr.io "$GHCR_CACHE"
          add_mirror docker.io "$DOCKERHUB_CACHE"

          # An empty file is valid TOML and means "no mirrors", but a comment says so in the log.
          [ -s "$toml" ] || echo '# no registry cache answered; BuildKit pulls from upstream' > "$toml"

          echo "config=$toml" >> "$GITHUB_OUTPUT"
          echo "BuildKit config for this run:"
          sed 's/^/  /' "$toml"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: ${{ steps.regcache.outputs.config }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` only for a full release -- a prerelease must never become the default pull, which is
      # exactly how GitLab split `Build Docker Release` from `Build Docker PreRelease`.
      - name: Compute tags
        id: tags
        run: |
          V="${{ needs.prepare.outputs.version }}"
          U="${{ secrets.DOCKERHUB_USER }}"; R="${{ secrets.DOCKERHUB_REPO }}"
          TAGS="ghcr.io/$U/$R:$V,index.docker.io/$U/$R:$V"
          if [ "${{ needs.prepare.outputs.prerelease }}" = "false" ]; then
            TAGS="$TAGS,ghcr.io/$U/$R:latest,index.docker.io/$U/$R:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # Retried for the same reason `docker-test.yml` retries: ghcr answers a pull with
      # `429 Too Many Requests / retry-after: 933.17us, allowed: 44000/minute` when the runner host trips
      # its per-source burst limiter, and buildkit will not wait. The limiter is keyed on the host, so
      # being logged in does not lift it. Here a single such minute would cost the release its images and
      # take the `mirror` job (`needs: docker`) with it.
      #
      # The retry is expensive and deliberately so: `no-cache: true` means attempt two rebuilds the whole
      # Gradle stage, ~15 minutes. Pushing the same tags twice is idempotent, so the only cost of a
      # needless retry is time, and the cost of not having one is a release with no image.
      - name: Build and push
        id: buildpush
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Wait out the registry's burst limiter
        if: ${{ steps.buildpush.outcome == 'failure' }}
        run: |
          echo "The first build-and-push failed. If it was a registry 429 the limiter has long since reset; retrying once."
          sleep 30

      - name: Build and push (retry)
        if: ${{ steps.buildpush.outcome == 'failure' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}

  mirror:
    name: "Mirror release outward"
    # Last, and after everything: the plan for this migration said the mirror "runs last and only on
    # success", and that has to include `maven` and `docker` -- otherwise GitHub can advertise a release
    # whose artifacts and images do not exist yet, or never will. `virustotal` is in here too because it
    # PATCHes the Forgejo release body with the scan permalinks, and the mirror copies that body; without
    # the dependency the GitHub release would never carry the section, which the workflow this replaced
    # added via `update_release_body`.
    needs: [prepare, assets, release, maven, docker, virustotal, winimage]
    runs-on: ubuntu-latest
    steps:

      - uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: release-assets
          path: assets

      # Beside the `release-assets` above, not inside it: `winimage` runs AFTER `assets` so the jar it
      # packages is the released one, which means its output cannot be part of that artifact. Every
      # consumer of the asset set therefore merges it in the same way; see claude-docs/WINDOWS-RUNNER.md.
      - uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          pattern: winimage-*
          merge-multiple: true
          path: assets

      # Forgejo push-mirrors replicate refs but NOT releases, so this is explicit rather than a setting.
      # It runs only after the Forgejo release exists, so no downstream forge ever advertises a release
      # this one does not have. The tag itself arrives by ordinary git mirroring.
      #
      # GitHub is the only outward mirror. Before adding another, confirm the git push-mirror to it is
      # alive and that it already has the tag: a release API needs either an existing tag or a `ref`
      # commit to mint one from, and a mirror that has stopped receiving commits has neither. That is a
      # precondition no release-API work can substitute for.
      - name: Fetch release notes from Forgejo
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          # -o/-w rather than -f: `curl -sf` sets exit 22 and discards the body, so a failure reports
          # `exitcode '22'` and nothing else. The body is where every one of these APIs says what is wrong.
          STATUS="$(curl -sS -o release.json -w '%{http_code}' \
            "https://git.griefed.de/api/v1/repos/Griefed/ServerPackCreator/releases/${{ needs.release.outputs.release_id }}" \
            -H "Authorization: token $TOKEN")"
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Forgejo returned HTTP $STATUS reading release ${{ needs.release.outputs.release_id }}"
            cat release.json
            exit 1
          fi
          # LANDMINE - GitHub rejects a release body over 125,000 characters with a 422, and Forgejo
          # has no such cap: its `Release.Note` is a TEXT column it never truncates (only `Title`, at
          # 255). The instance proves the asymmetry -- 9.0.0-alpha.8's Forgejo body is 75,918 bytes,
          # already past MySQL TEXT's 65,535, and 9.0.0-beta.1's notes are 200,185. So the canonical
          # Forgejo release keeps the full notes and only the mirrored copy is cut, on a line boundary
          # so no markdown link is severed, with a pointer back to the forge that has all of it.
          python3 - <<'TRUNCATE_PY'
          import json, os

          # GitHub's documented maximum for a release body.
          LIMIT = 125000
          version = os.environ["VERSION"]
          body = json.load(open("release.json"))["body"]
          if len(body) > LIMIT:
              notice = ("\n\n---\n\nThese notes were truncated to fit GitHub's 125,000-character limit "
                        "for a release body. The complete notes are on Forgejo: "
                        f"https://git.griefed.de/Griefed/ServerPackCreator/releases/tag/{version}\n")
              body = body[:LIMIT - len(notice)].rsplit("\n", 1)[0] + notice
              print(f"Release notes truncated to {len(body)} characters for GitHub")
          open("notes.md", "w").write(body)
          TRUNCATE_PY

      # LANDMINE - the mirror step's precondition is the mirror, NOT the API call. `target_commitish`
      # below lets GitHub mint a tag it does not have, but only from a commit it DOES have, and a
      # push-mirror that has stopped has delivered neither. That is how 9.0.0-alpha.7 failed: GitHub
      # answered the release POST with a 422 listing `tag_name is not a valid tag`, `Published releases
      # must have a valid tag` and an invalid `target_commitish`, none of which mentions the mirror, while
      # `GET /commits/50fd50f37` returned 422 `No commit found for SHA` and GitHub's `alpha` still sat on
      # `RELEASE: 9.0.0-alpha.6`, 69 commits behind. Probe the precondition here and name the real cause.
      #
      # Poll rather than fail at once: `Sync when new commits are pushed` is an OPT-IN checkbox on a
      # Forgejo push-mirror, and without it the mirror is periodic on an interval that defaults to 8h.
      # No release can wait that long, but one merely queued behind a large push is worth a few minutes.
      - name: Require GitHub to have the release commit
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          SHA="${{ github.sha }}"
          API="https://api.github.com/repos/Griefed/ServerPackCreator"
          for attempt in $(seq 1 20); do
            STATUS="$(curl -sS -o probe.json -w '%{http_code}' "$API/commits/$SHA" \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')"
            if [ "$STATUS" = "200" ]; then
              echo "GitHub has $SHA (attempt $attempt) - safe to create the release"
              exit 0
            fi
            # 401/403 is the token, not the mirror. Waiting five minutes on a credential problem and
            # then blaming the mirror is exactly the misdiagnosis this step exists to prevent.
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              cat probe.json
              echo "::error::GH_TOKEN was rejected with HTTP $STATUS probing $SHA - this is the credential, not the mirror. See claude-docs/CI-SECRETS.md."
              exit 1
            fi
            echo "attempt $attempt/20: GitHub answered HTTP $STATUS for $SHA - waiting 15s"
            sleep 15
          done
          cat probe.json
          echo "::error::The Forgejo->GitHub push-mirror has not delivered ${{ github.sha }} after 5 minutes, so GitHub cannot mint tag ${{ github.ref_name }} and the release POST below would fail with a 422 about tag_name/target_commitish. Repair the mirror first: repo Settings -> Mirror Settings -> Synchronize Now, and READ the error it prints there. Confirm with: curl -s -o /dev/null -w '%{http_code}' ${API}/commits/${{ github.sha }} returning 200. Then re-run THIS JOB ALONE - a whole-workflow re-run would re-publish Maven and Docker for a version that is already released."
          exit 1

      - name: Mirror to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          # target_commitish is not optional here. GitHub creates the tag from it when the tag does not
          # exist, defaulting to the DEFAULT BRANCH -- and git mirroring is asynchronous, so seconds after
          # the Forgejo release the tag usually has not arrived. Without this, GitHub would create a
          # `$V` tag pointing at main's HEAD, disagreeing with Forgejo and blocking the real tag later.
          # It covers an absent TAG only; the commit it names still has to be there, which is what the
          # step above guarantees. 9.0.0-alpha.6 is the proof it works when the mirror is current -- its
          # GitHub release carries target_commitish f7ebba4e, not `main` as .1 through .5 do.
          V="${{ needs.prepare.outputs.version }}"
          PRE="${{ needs.prepare.outputs.prerelease }}"
          API="https://api.github.com/repos/Griefed/ServerPackCreator"
          export MIRROR_VERSION="$V" MIRROR_PRERELEASE="$PRE" MIRROR_SHA="${{ github.sha }}"
          # Same landmine as the `release` job's POST, and for the same reason -- this body is a copy of
          # that one, so the moment it is too big for argv there it is too big here. Build the payload in
          # a file and hand curl `-d @file`; nothing of the notes goes near the argument list.
          python3 -c "import json,os;print(json.dumps({'tag_name':os.environ['MIRROR_VERSION'],'target_commitish':os.environ['MIRROR_SHA'],'name':os.environ['MIRROR_VERSION'],'body':open('notes.md').read(),'prerelease':os.environ['MIRROR_PRERELEASE']=='true'}))" > create-payload.json
          # Reuse an existing GitHub release for this tag, exactly as the `release` job does for Forgejo,
          # and for the same reason: re-running this job alone is the documented repair when the mirror
          # was behind, and it is the ONLY safe repair -- a whole-workflow re-run would re-publish Maven
          # and Docker for a version already released. Without reuse, a re-run after a half-finished
          # asset loop dies on GitHub's `already_exists` and the release stays half-populated.
          ID="$(curl -sS "$API/releases/tags/$V" -H "Authorization: Bearer $GH_TOKEN" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('id') or '')" 2>/dev/null || true)"
          if [ -n "$ID" ]; then
            echo "GitHub release for $V already exists ($ID) - reusing it and refreshing its notes"
            python3 -c "import json;print(json.dumps({'body':open('notes.md').read()}))" > patch.json
            STATUS="$(curl -sS -o patched.json -w '%{http_code}' -X PATCH "$API/releases/$ID" \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -d @patch.json)"
            if [ "$STATUS" -ge 400 ]; then
              echo "::error::GitHub returned HTTP $STATUS patching release $ID"
              cat patched.json
              exit 1
            fi
          else
            STATUS="$(curl -sS -o created.json -w '%{http_code}' \
              -X POST "$API/releases" \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -d @create-payload.json)"
            if [ "$STATUS" -ge 400 ]; then
              echo "::error::GitHub returned HTTP $STATUS creating release $V"
              cat created.json
              exit 1
            fi
            ID="$(python3 -c 'import json;print(json.load(open("created.json"))["id"])')"
          fi
          # Names already attached, so a re-run tops up the gap instead of failing on a duplicate name.
          curl -sS "$API/releases/$ID/assets?per_page=100" -H "Authorization: Bearer $GH_TOKEN" \
            | python3 -c "import json,sys;print('\n'.join(a['name'] for a in json.load(sys.stdin)))" > have.txt
          for f in assets/*; do
            NAME="$(basename "$f")"
            if grep -qxF "$NAME" have.txt; then
              echo "GitHub already has $NAME - skipping"
              continue
            fi
            STATUS="$(curl -sS -o upload.json -w '%{http_code}' -X POST \
              "https://uploads.github.com/repos/Griefed/ServerPackCreator/releases/$ID/assets?name=$NAME" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@$f")"
            if [ "$STATUS" -ge 400 ]; then
              echo "::error::GitHub returned HTTP $STATUS uploading $NAME"
              cat upload.json
              exit 1
            fi
            echo "GitHub <- $NAME"
          done


  virustotal:
    name: "VirusTotal scan"
    needs: [prepare, assets, release]
    runs-on: ubuntu-latest
    steps:

      - uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: release-assets
          path: assets

      # Submits through VirusTotal's API directly rather than through `crazy-max/ghaction-virustotal`,
      # which updates a *GitHub* release body: the assets are already here as an artifact, and the
      # permalinks belong on the Forgejo release notes.
      #
      # Files over 32 MB need a one-time upload URL; that is what the branch below is for. Failures are
      # tolerated: a scan that does not come back must not fail a release that is already published.
      # The Windows app-images are deliberately NOT downloaded here, unlike in `release` and `mirror`:
      # the loop below scans `*.jar *.sh *.dmg *.exe`, which already excludes the AppImages. A portable
      # archive is not an installer, and scanning a zip of a zip of a JRE tells a reader nothing.
      - name: Submit assets to VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -eu
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "No VT_API_KEY configured - skipping"; exit 0
          fi
          : > links.md
          for f in assets/*.jar assets/*.sh assets/*.dmg assets/*.exe; do
            [ -e "$f" ] || continue
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -gt 33554432 ]; then
              URL=$(curl -sf -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url \
                    | python3 -c "import json,sys;print(json.load(sys.stdin)['data'])")
            else
              URL="https://www.virustotal.com/api/v3/files"
            fi
            ID=$(curl -sf -X POST "$URL" -H "x-apikey: $VT_API_KEY" -F "file=@$f" \
                 | python3 -c "import json,sys;print(json.load(sys.stdin)['data']['id'])" 2>/dev/null || true)
            if [ -n "$ID" ]; then
              echo "- \`$(basename "$f")\` - https://www.virustotal.com/gui/file-analysis/$ID" >> links.md
              echo "submitted $(basename "$f")"
            else
              echo "could not submit $(basename "$f")"
            fi
          done
          cat links.md || true

      - name: Append the scan links to the Forgejo release
        if: ${{ always() }}
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
          API: https://git.griefed.de/api/v1/repos/Griefed/ServerPackCreator
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -eu
          [ -s links.md ] || { echo "Nothing to append"; exit 0; }
          STATUS="$(curl -sS -o release.json -w '%{http_code}' "$API/releases/$RELEASE_ID" \
            -H "Authorization: token $TOKEN")"
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Forgejo returned HTTP $STATUS reading release $RELEASE_ID"
            cat release.json
            exit 1
          fi
          python3 -c "import json;open('body.txt','w').write(json.load(open('release.json'))['body'])"
          printf '\n\n## VirusTotal\n\n' >> body.txt
          cat links.md >> body.txt
          python3 -c "import json;print(json.dumps({'body':open('body.txt').read()}))" > patch.json
          STATUS="$(curl -sS -o patched.json -w '%{http_code}' -X PATCH "$API/releases/$RELEASE_ID" \
            -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @patch.json)"
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Forgejo returned HTTP $STATUS appending the VirusTotal section to release $RELEASE_ID"
            cat patched.json
            exit 1
          fi
          echo "Release notes updated"

  news:
    name: "News on Discord"
    # One job for both channels: `prepare.outputs.prerelease` chooses the wording.
    #
    # It announces the FORGEJO release -- the canonical one -- and therefore deliberately does NOT need
    # `mirror`: a stalled push-mirror must not silence the announcement of a release that is complete
    # here. It does wait for `maven` and `docker`, on the same reasoning `mirror` gives for its own
    # `needs`: nobody should be pointed at a release whose artifacts and images do not exist yet.
    # `virustotal` is left out because its own failures are explicitly tolerated and this announcement
    # does not reproduce the release notes.
    needs: [prepare, release, maven, docker]
    runs-on: ubuntu-latest
    steps:

      # The payload is built by python, the way qodana.yml builds its own: fetching and executing a
      # third-party shell script for what is only a JSON builder is remote code execution by trust.
      # Every value reaches python through `env:` rather than being interpolated into the shell.
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.NEWS_WEBHOOK_URL }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # A missing webhook is fine and exits cleanly; a webhook that IS configured and then fails to
          # accept the post is a real failure and must not be swallowed -- hence set -e after the guard,
          # exactly as in qodana.yml's post.
          if [ -z "${NEWS_WEBHOOK_URL:-}" ]; then
            echo "No NEWS_WEBHOOK_URL configured - skipping"
            exit 0
          fi
          set -eu
          export RELEASED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > news.py <<'NEWS_PY'
          import json, os

          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          server = os.environ["SERVER_URL"].rstrip("/")
          # `prepare` writes exactly "true" or "false" and refuses any tag that is neither shape, so this
          # comparison cannot silently mis-class a release.
          prerelease = os.environ["PRERELEASE"] == "true"
          noun = "pre-release" if prerelease else "release"
          headline = "Pre-Release" if prerelease else "Release"
          url = f"{server}/{repository}/releases/tag/{version}"
          sentence = (f"There's been a new {noun} for {repository}. "
                      f"The new version is {version} and is available at")
          payload = {
              "username": repository,
              "avatar_url": "https://git.griefed.de/Griefed/ServerPackCreator/raw/branch/main/img/prosper.png",
              # The angle brackets suppress Discord's own link unfurl in the message body, as the
              # original did -- the embed below is the preview.
              "content": f"{sentence} <{url}>",
              "embeds": [{
                  "title": f"New {repository} {headline}",
                  "description": f"{sentence} {url}",
                  "url": url,
                  "color": 12648430,  # 0xC0FFEE, the colour used on main
                  "author": {
                      "name": "Griefed",
                      "url": f"{server}/Griefed",
                      "icon_url": "https://www.griefed.de/img/sam_icon.c4ec5b56.webp",
                  },
                  "thumbnail": {"url": "https://git.griefed.de/Griefed/ServerPackCreator/raw/branch/main/img/app_128x128.png"},
                  "fields": [
                      {"name": "Author", "value": f"[Griefed]({server}/Griefed)", "inline": True},
                      # Was "GitHub". Forgejo is where the release lives now and what `url` points at.
                      {"name": "Platform", "value": f"[Forgejo]({server})", "inline": True},
                  ],
                  "footer": {
                      "text": f"Released at {os.environ['RELEASED_AT']}",
                      "icon_url": "https://git.griefed.de/Griefed/ServerPackCreator/ra",
                  },
              }],
          }
          print(json.dumps(payload))
          NEWS_PY
          python3 news.py > payload.json
          STATUS="$(curl -sS -o posted.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d @payload.json "$NEWS_WEBHOOK_URL")"
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::The Discord webhook returned HTTP $STATUS"
            cat posted.json
            exit 1
          fi
          echo "Announced $VERSION at $SERVER_URL/$REPOSITORY/releases/tag/$VERSION"
