# The rolling dev build -- effectively the nightly. Produces the JAR, the AppImages and the install4j
# media, and publishes them as the `continuous` release.
name: Continuous

on:
  push:
    branches:
      - develop
  schedule:
    # Nightly as well as on push, so a quiet day still refreshes the build instead of leaving a stale one
    # on the download page.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (optional, defaults to branch/tag)'
        required: false
        type: string

# Required, not tidy-up. The GitHub original had no guard either, but it updated the `continuous` release
# in place (`allowUpdates`/`replacesArtifacts`), which overlapping runs survive untidily. This port
# deletes-then-recreates so stale assets cannot linger -- right for one run, wrong for two: concurrent
# runs can interleave delete and create, and there is a window where the release users are pointed at
# does not exist. cancel-in-progress because only the newest develop commit is worth publishing.
concurrency:
  group: devbuild
  cancel-in-progress: true

jobs:
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - name: Determine version
        id: version
        # Untrusted-ish dispatch input is passed via env (never interpolated into the script) to
        # avoid shell injection; github.* contexts below are controlled by the runner.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ "$REF_NAME" = "main" ]; then
            VERSION="$(git describe --tags --always)"
          else
            VERSION="${REF_NAME}-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Set Permissions
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew clean build -Pversion=${{ steps.version.outputs.version }} \
            --info --full-stacktrace --warning-mode all \
            -x :serverpackcreator-api:test -x :serverpackcreator-app:test

      - name: Upload JARs
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: gradle-jars
          path: |
            serverpackcreator-api/build/libs/*.jar
            serverpackcreator-app/build/libs/*.jar
            serverpackcreator-plugin-*/build/libs/*_experimental.jar
          retention-days: 1

  build-appimage-x86_64:
    name: Build AppImage (x86_64)
    needs: build-jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download JARs
        uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: gradle-jars
          path: .

      # `misc/build-appimage.sh` owns both values; a copy here is a copy that goes stale. The cache KEY
      # carries the pinned release while the PATH is only the directory the script unpacks into
      # (`jdk-<major>-<arch>`) -- the script skips the download when that directory already exists, so a
      # key naming the major alone would serve a superseded JDK for ever after a JDK_RELEASE bump.
      - name: Resolve the AppImage JDK
        id: jdk
        run: |
          set -e
          MAJOR="$(sed -n 's/^JDK_VERSION="\(.*\)"$/\1/p' misc/build-appimage.sh)"
          RELEASE="$(sed -n 's/^JDK_RELEASE="\(.*\)"$/\1/p' misc/build-appimage.sh)"
          test -n "$MAJOR" && test -n "$RELEASE" || { echo "::error::could not read JDK_VERSION/JDK_RELEASE from misc/build-appimage.sh"; exit 1; }
          echo "dir=jdk-$MAJOR-x86_64" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Cache JDK download
        uses: actions/cache@v5
        with:
          path: ${{ steps.jdk.outputs.dir }}
          key: ${{ steps.jdk.outputs.dir }}-${{ steps.jdk.outputs.release }}

      - name: Build AppImage for x86_64 (native)
        run: |
          chmod +x misc/build-appimage.sh
          misc/build-appimage.sh --update-channel continuous "${{ needs.build-jar.outputs.version }}"

      # Resolved by glob, never spelled out: `misc/build-appimage.sh` owns the filename (it appends
      # `_experimental`), and a copy here is a copy that goes stale the next time it changes. The glob is
      # anchored on `ServerPackCreator-` rather than `*.AppImage` because the script downloads
      # `appimagetool-<arch>.AppImage` into this same directory and a bare glob would match it.
      - name: Verify AppImage
        id: appimage
        run: |
          APPIMAGE="$(ls -1 ServerPackCreator-*.AppImage 2>/dev/null | head -n 1)"
          if [ -z "$APPIMAGE" ]; then
            echo "❌ Error: no ServerPackCreator AppImage was produced"
            ls -la *.AppImage 2>/dev/null || echo "No AppImages found"
            exit 1
          fi
          echo "✅ AppImage created successfully:"
          ls -lh "$APPIMAGE"
          echo "name=$APPIMAGE" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          APPIMAGE="${{ steps.appimage.outputs.name }}"
          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"
          echo "Checksum generated:"
          cat "$APPIMAGE.sha256"

      - name: Upload AppImage artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: appimage-x86_64
          # The `.zsync` too: an AppImage advertising `gh-releases-zsync` whose `.zsync` is not in the
          # same release cannot update, and nothing says so until a user tries.
          path: |
            ServerPackCreator-*.AppImage
            ServerPackCreator-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 1

      - name: Upload checksums
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: appimage-x86_64-checksum
          path: "*.sha256"
          retention-days: 1


  build-appimage-aarch64:
    name: Build AppImage (aarch64)
    needs: build-jar
    # An amd64 runner, deliberately, for an aarch64 artifact: the AppImage is cross-packaged. Nothing
    # aarch64 has to *run* here -- the JDK is downloaded and unpacked, the JAR arrives from build-jar,
    # and appimagetool runs as the host's architecture while ARCH tells it which runtime to embed. That
    # keeps this job off the `ubuntu-24.04-arm` label, which no registered runner offers ("No matching
    # online runner with label"), and off QEMU. Supporting that label instead would have meant a
    # `?platform=linux/arm64` label on the runner plus binfmt handlers on its host.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download JARs
        uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: gradle-jars
          path: .

      # `misc/build-appimage.sh` owns both values; a copy here is a copy that goes stale. The cache KEY
      # carries the pinned release while the PATH is only the directory the script unpacks into
      # (`jdk-<major>-<arch>`) -- the script skips the download when that directory already exists, so a
      # key naming the major alone would serve a superseded JDK for ever after a JDK_RELEASE bump.
      - name: Resolve the AppImage JDK
        id: jdk
        run: |
          set -e
          MAJOR="$(sed -n 's/^JDK_VERSION="\(.*\)"$/\1/p' misc/build-appimage.sh)"
          RELEASE="$(sed -n 's/^JDK_RELEASE="\(.*\)"$/\1/p' misc/build-appimage.sh)"
          test -n "$MAJOR" && test -n "$RELEASE" || { echo "::error::could not read JDK_VERSION/JDK_RELEASE from misc/build-appimage.sh"; exit 1; }
          echo "dir=jdk-$MAJOR-aarch64" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Cache JDK download
        uses: actions/cache@v5
        with:
          path: ${{ steps.jdk.outputs.dir }}
          key: ${{ steps.jdk.outputs.dir }}-${{ steps.jdk.outputs.release }}

      - name: Build AppImage for aarch64 (cross-packaged)
        run: |
          chmod +x misc/build-appimage.sh
          misc/build-appimage.sh --arch aarch64 --update-channel continuous "${{ needs.build-jar.outputs.version }}"

      # Resolved by glob, never spelled out: `misc/build-appimage.sh` owns the filename (it appends
      # `_experimental`), and a copy here is a copy that goes stale the next time it changes. The glob is
      # anchored on `ServerPackCreator-` rather than `*.AppImage` because the script downloads
      # `appimagetool-<arch>.AppImage` into this same directory and a bare glob would match it.
      - name: Verify AppImage
        id: appimage
        run: |
          APPIMAGE="$(ls -1 ServerPackCreator-*.AppImage 2>/dev/null | head -n 1)"
          if [ -z "$APPIMAGE" ]; then
            echo "❌ Error: no ServerPackCreator AppImage was produced"
            ls -la *.AppImage 2>/dev/null || echo "No AppImages found"
            exit 1
          fi
          echo "✅ AppImage created successfully:"
          ls -lh "$APPIMAGE"
          echo "name=$APPIMAGE" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          APPIMAGE="${{ steps.appimage.outputs.name }}"
          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"
          echo "Checksum generated:"
          cat "$APPIMAGE.sha256"

      - name: Upload AppImage artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: appimage-aarch64
          # The `.zsync` too: an AppImage advertising `gh-releases-zsync` whose `.zsync` is not in the
          # same release cannot update, and nothing says so until a user tries.
          path: |
            ServerPackCreator-*.AppImage
            ServerPackCreator-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 1

      - name: Upload checksums
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: appimage-aarch64-checksum
          path: "*.sha256"
          retention-days: 1

  # jpackage CANNOT CROSS-COMPILE (JEP 392, explicit non-goal), which is the whole reason this job exists
  # separately and needs a runner the Linux ones cannot stand in for. An AppImage is a tarball plus a
  # prebuilt runtime stub, so build-appimage.sh cross-packages aarch64 from an amd64 runner; a jpackage
  # app-image carries a native launcher built with the HOST's toolchain.
  #
  # A `:host`-scheme Windows runner is a HOST prerequisite -- see claude-docs/WINDOWS-RUNNER.md. Until one
  # is registered this job does not fail, it sits queued on "No matching online runner with label",
  # exactly as the `ubuntu-24.04-arm` label does and for the same reason.
  #
  # x86_64 ONLY, deliberately. A Windows ARM64 artifact needs a native ARM64 Windows runner, and the only
  # way to host one here is an emulated guest, whose throughput is not fit to gate a release on. Windows
  # on ARM64 runs x86_64 binaries, so that audience is served by this artifact.
  build-winimage-x86_64:
    name: Build Windows app-image (x86_64)
    needs: build-jar
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true

      - name: Download JARs
        uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: gradle-jars
          path: .

      # Resolved by glob, never spelled out: `misc/build-winimage.ps1` owns the filename (it appends
      # `_experimental`), and a copy here is a copy that goes stale the next time it changes.
      - name: Build the Windows app-image for x86_64
        # `powershell`, NOT `pwsh`. PowerShell 7 is a separate install that Windows does not ship and the
        # runner guest does not have, so `shell: pwsh` fails before the step runs with
        # `Cannot find: pwsh in PATH`. `powershell` is Windows PowerShell 5.1, present on every Windows
        # host, and everything below plus build-winimage.ps1 is written to its dialect.
        shell: powershell
        run: |
          misc/build-winimage.ps1 -Version "${{ needs.build-jar.outputs.version }}" -Arch x86_64
          # @() so a single match is still an array: unwrapped, 5.1 hands back a bare FileInfo.
          $image = @(Get-ChildItem "ServerPackCreator-*-Windows-x86_64_experimental.zip")
          if ($image.Count -ne 1) { Write-Output "::error::expected 1 Windows app-image, found $($image.Count)"; exit 1 }
          (Get-FileHash $image[0].FullName -Algorithm SHA256).Hash.ToLower() + "  " + $image[0].Name `
            | Set-Content -NoNewline "$($image[0].Name).sha256"

      - name: Upload Windows app-image
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: winimage-x86_64
          path: ServerPackCreator-*-Windows-x86_64_experimental.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload checksums
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: winimage-x86_64-checksum
          path: "*.sha256"
          retention-days: 1


  build-media:
    name: Build Install4J Media
    needs: build-jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - uses: https://github.com/luangong/setup-install4j@v1
        with:
          version: '13.1'
          license: ${{ secrets.INSTALL4J_LICENSE }}

      # `-f`, matching release-build.yml:168: the installer is only present because `setup-install4j`
      # left it there, so a version of that action which cleans up after itself would fail this job on
      # a glob that matched nothing.
      - name: Remove install4j script
        run: rm -f install4j_linux-x64_*.sh

      - name: Download JARs
        uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: gradle-jars
          path: .

      - name: Set Permissions
        run: chmod +x gradlew

      - name: Build Install4J Media
        run: ./gradlew media --info --full-stacktrace

      - name: Upload Media
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: install4j-media
          path: media/*
          retention-days: 1

  continuous:
    name: "Continuous Pre-Release"
    # LANDMINE -- `build-winimage-x86_64` needs a Windows runner that is a HOST prerequisite
    # (claude-docs/WINDOWS-RUNNER.md). Until one is registered that job does not fail, it QUEUES on
    # "No matching online runner with label", and this job waits on it, so the continuous pre-release
    # stops being published rather than being published short an artifact. That is the intended
    # direction -- a stalled release is diagnosable and a quietly incomplete one is not -- but it means
    # the host half really does have to come first.
    needs: [
      build-jar,
      build-appimage-x86_64,
      build-appimage-aarch64,
      build-winimage-x86_64,
      build-media
    ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir continuous

          echo "=== Collecting AppImages ==="
          find artifacts/appimage-x86_64  -name "*.AppImage" -exec cp -v {} continuous/ \; 2>/dev/null || echo "No x86_64 AppImages"
          find artifacts/appimage-aarch64 -name "*.AppImage" -exec cp -v {} continuous/ \; 2>/dev/null || echo "No aarch64 AppImages"
          # The update route the AppImages advertise is `gh-releases-zsync|...|continuous|...`, which
          # resolves the `.zsync` out of THIS release -- so they are assets, not build leftovers.
          find artifacts -name "*.AppImage.zsync" -exec cp -v {} continuous/ \; 2>/dev/null || echo "No zsync files"
          ZSYNCS="$(ls -1 continuous/*.AppImage.zsync 2>/dev/null | wc -l)"
          if [ "$ZSYNCS" -ne 2 ]; then
            echo "::error::Expected 2 .zsync files beside the AppImages, found $ZSYNCS"
            exit 1
          fi

          echo ""
          echo "=== Collecting Windows app-images ==="
          find artifacts/winimage-x86_64 -name "*_experimental.zip" -exec cp -v {} continuous/ \; 2>/dev/null || echo "No x86_64 Windows app-image"

          echo ""
          echo "=== Collecting Checksums ==="
          find artifacts -name "*.sha256" -exec cp -v {} continuous/ \; 2>/dev/null || echo "No checksums"

          echo ""
          echo "=== Collecting JARs ==="
          find artifacts/gradle-jars -name "*.jar" ! -name "*-plain.jar" -exec cp -v {} continuous/ \; 2>/dev/null || echo "No JARs"

          echo ""
          echo "=== Collecting Install4J Media ==="
          cp artifacts/install4j-media/*.dmg continuous/ 2>/dev/null || echo "No DMG files"
          cp artifacts/install4j-media/*.sh  continuous/ 2>/dev/null || echo "No SH files"
          cp artifacts/install4j-media/*.exe continuous/ 2>/dev/null || echo "No EXE files"

          echo ""
          echo "=== Final Contents ==="
          ls -lh continuous/

      - name: Generate checksum
        uses: https://github.com/jmgilman/actions-generate-checksum@v1
        with:
          patterns: |
            continuous/*

      - name: Collect checksum
        run: cp checksum.txt continuous/

      # Moves the rolling `continuous` tag on FORGEJO. It was `richardsimko/update-tag` with
      # `secrets.GITHUB_TOKEN` -- a GitHub action moving a GitHub tag, which is the wrong forge now, and a
      # bare reference that would not resolve against DEFAULT_ACTIONS_URL anyway.
      #
      # It matters more than it looks: the release below is created against tag `continuous`, and the
      # source archives are fetched from /archive/continuous.zip. If the tag does not move, every dev build
      # publishes fresh assets under a stale tag, with source archives of a different commit.
      - name: Move the continuous tag
        env:
          FORGEJO_ACTOR: ${{ secrets.FJ_ACTOR }}
          FORGEJO_TOKEN: ${{ secrets.FJ_TOKEN }}
        run: |
          set -eu
          auth=$(printf '%s:%s' "$FORGEJO_ACTOR" "$FORGEJO_TOKEN" | base64 | tr -d '\n')
          git tag -f continuous "${{ github.sha }}"
          git -c http.extraheader="Authorization: Basic ${auth}" \
            push --force "https://git.griefed.de/Griefed/ServerPackCreator.git" refs/tags/continuous
          echo "continuous now points at ${{ github.sha }}"

      - name: Get build timestamp
        id: build_time
        run: echo "timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      # The rolling release lives on FORGEJO, so the API calls below are hand-rolled rather than an
      # action aimed at GitHub. Delete-then-recreate rather than update: that is the only way to be
      # certain the preceding build's assets are gone.
      #
      # The JSON payload is built by python from environment variables, not by shell interpolation -- the
      # body contains backticks, emoji and newlines, and quoting that by hand in YAML is a trap.
      - name: Refresh the Forgejo continuous release
        id: forgejo_release
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
          API: https://git.griefed.de/api/v1/repos/Griefed/ServerPackCreator
          TIMESTAMP: ${{ steps.build_time.outputs.timestamp }}
          COMMIT: ${{ github.sha }}
        run: |
          # pipefail matters here: every API call below is `curl | python3`, and without it the pipeline
          # reports PYTHON's status, so a curl that failed is invisible and surfaces as a parse error.
          set -eu -o pipefail
          OLD=$(curl -s "$API/releases/tags/continuous" -H "Authorization: token $TOKEN" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('id') or '')" 2>/dev/null || true)
          if [ -n "$OLD" ]; then
            echo "Deleting previous Forgejo continuous release $OLD (the tag is kept)"
            HTTP=$(curl -s -o delete.out -w '%{http_code}' -X DELETE "$API/releases/$OLD" \
                     -H "Authorization: token $TOKEN")
            if [ "$HTTP" != "204" ]; then
              echo "::error::deleting release $OLD answered HTTP $HTTP"
              cat delete.out || true
              exit 1
            fi
          fi
          python3 - > payload.json <<'PY'
          import json, os
          body = (
              "## \U0001F504 Continuous Dev-Build\n\n"
              f"**Built:** {os.environ['TIMESTAMP']}\n"
              f"**Commit:** `{os.environ['COMMIT']}`\n\n---\n\n"
              "This is an automated development build, updated every time changes are pushed to `develop`.\n\n"
              "\u26A0\uFE0F **Warning:** Do not use unless you have been told to, or are curious about the "
              "contents of the dev build.\n\n"
              "\U0001F6AB **Do not link to this release.**\n"
          )
          print(json.dumps({"tag_name": "continuous", "target_commitish": "develop",
                            "name": "continuous", "body": body,
                            "draft": False, "prerelease": True}))
          PY
          # NOT `curl -sf | python3`. `-f` makes curl print NOTHING on an HTTP error, so the API's own
          # explanation is discarded and json.load reports `Expecting value: line 1 column 1` -- a
          # traceback that names neither the status nor the reason. Capture both instead.
          HTTP=$(curl -s -o release.json -w '%{http_code}' -X POST "$API/releases" \
                   -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
                   -d @payload.json)
          if [ "$HTTP" != "201" ]; then
            echo "::error::creating the continuous release answered HTTP $HTTP"
            cat release.json || true
            exit 1
          fi
          ID=$(python3 -c 'import json;print(json.load(open("release.json"))["id"])')
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          for f in continuous/*; do
            curl -sf -X POST "$API/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f" > /dev/null
            echo "Forgejo <- $(basename "$f")"
          done

      # Asked for explicitly: clear GitHub's stale continuous RELEASE but leave its TAG alone, so the
      # mirror below recreates it from Forgejo rather than fighting a half-updated entry.
      - name: Delete the GitHub continuous release, keeping the tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          ID=$(curl -s "https://api.github.com/repos/Griefed/ServerPackCreator/releases/tags/continuous" \
                 -H "Authorization: Bearer $GH_TOKEN" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('id') or '')" 2>/dev/null || true)
          if [ -n "$ID" ]; then
            curl -sf -X DELETE "https://api.github.com/repos/Griefed/ServerPackCreator/releases/$ID" \
              -H "Authorization: Bearer $GH_TOKEN"
            echo "Deleted GitHub release $ID; the 'continuous' tag is untouched"
          else
            echo "No GitHub continuous release to delete"
          fi

      - name: Mirror the continuous release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          ID=$(curl -sf -X POST "https://api.github.com/repos/Griefed/ServerPackCreator/releases" \
                 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                 -d '{"tag_name":"continuous","name":"continuous","prerelease":true,"body":"Mirrored from https://git.griefed.de/Griefed/ServerPackCreator/releases/tag/continuous"}' \
               | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          for f in continuous/*; do
            curl -sf -X POST \
              "https://uploads.github.com/repos/Griefed/ServerPackCreator/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$f" > /dev/null
            echo "GitHub <- $(basename "$f")"
          done

      - name: Get source archives
        run: |
          wget -O continuous/source.zip    https://git.griefed.de/Griefed/ServerPackCreator/archive/continuous.zip
          wget -O continuous/source.tar.gz https://git.griefed.de/Griefed/ServerPackCreator/archive/continuous.tar.gz

      - name: Cleanup continuous on server
        uses: https://github.com/tiyee/action-ssh@v1.0.1
        with:
          host: ${{ secrets.SPCUPLOAD_HOST }}
          username: ${{ secrets.SPCUPLOAD_USERNAME }}
          privateKey: ${{ secrets.SPCUPLOAD_KEY }}
          command: 'rm -rf ~/spc/continuous'

      - name: Upload to server
        uses: https://github.com/nogsantos/scp-deploy@v1.3.0
        with:
          src: ./continuous
          host: ${{ secrets.SPCUPLOAD_HOST }}
          remote: "${{ secrets.SPCUPLOAD_TARGET }}"
          user: ${{ secrets.SPCUPLOAD_USERNAME }}
          key: ${{ secrets.SPCUPLOAD_KEY }}