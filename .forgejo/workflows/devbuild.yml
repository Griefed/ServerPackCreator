# The rolling dev build. Every push to `develop` produces the JAR, the AppImages, the Windows app-image
# and the install4j media, and publishes them as the `continuous` release.
name: Continuous

# NO `schedule:` TRIGGER, and adding one back does not do what it looks like. Forgejo runs a scheduled
# workflow only on the DEFAULT BRANCH, which is `main` -- so the nightly built the RELEASED code, took
# the `git describe` branch of the version resolver because `github.ref_name` was `main`, and
# republished `9.2.0` as the dev build, moving the rolling `continuous` tag onto `main` until the next
# develop push moved it back. Measured in the published release of 2026-10-07: jars named `9.2.0` under
# the `continuous` tag, from a run whose job log reads `triggered by event: schedule`.
#
# A nightly rebuild of unchanged source is also no fresher than the push build it replaces, and this
# workflow publishes rather than tests, so it could not catch dependency drift either.
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (optional, defaults to branch/tag)'
        required: false
        type: string

# Required, not tidy-up. The GitHub original had no guard either, but it updated the `continuous` release
# in place (`allowUpdates`/`replacesArtifacts`), which overlapping runs survive untidily. This port
# deletes-then-recreates so stale assets cannot linger -- right for one run, wrong for two: concurrent
# runs can interleave delete and create, and there is a window where the release users are pointed at
# does not exist. cancel-in-progress because only the newest develop commit is worth publishing.
concurrency:
  group: devbuild
  cancel-in-progress: true

jobs:
  # Only the version. `release-build.yml`'s `prepare` has the same shape, which is what lets both pass
  # `version` into the same artifact workflow as a plain input -- nothing has to flow back out of it.
  prepare:
    name: "Preparations"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # `fetch-depth: 0` is required: `branch` mode runs `git describe`, and a shallow clone answers
      # with a bare sha that looks like a version. The action reports that rather than absorbing it.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The dispatch input, when one was given, wins over the derived name. It reaches the action as an
      # input rather than being read there, so the untrusted-ish value still travels through the
      # environment and never through interpolation into a script.
      - name: Determine version
        id: version
        uses: ./.forgejo/actions/resolve-version
        with:
          mode: branch
          override: ${{ inputs.version }}

  # Every artifact, from the definition `release-build.yml` also calls. NO `runs-on:` -- Forgejo
  # disables workflow expansion for a calling job that declares one.
  #
  # `secrets: inherit` rather than a `secrets:` block: `on.workflow_call.secrets` is a schema violation
  # on Forgejo. It is all-or-nothing, so this hands over every credential the repository holds for the
  # sake of INSTALL4J_LICENSE.
  build:
    name: "Build"
    needs: prepare
    uses: ./.forgejo/workflows/artifacts-reusable.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      # The `gh-releases-zsync` channel baked into the AppImages, so a dev build updates from the
      # rolling `continuous` release rather than from the newest tagged one.
      update-channel: continuous
    secrets: inherit

  continuous:
    name: "Continuous Pre-Release"
    # LANDMINE -- the artifact workflow's `winimage` job needs a Windows runner that is a HOST
    # prerequisite (claude-docs/WINDOWS-RUNNER.md). Without one it does not fail, it QUEUES on "No
    # matching online runner with label"; `stage` waits on it, so `build` never completes and this job
    # never starts. The continuous pre-release stops being published rather than being published short
    # an artifact -- the intended direction, since a stalled release is diagnosable and a quietly
    # incomplete one is not, but it does mean the host half really has to come first.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The staged asset set, exactly as `release-build.yml` consumes it. There is no collection step
      # here any more: `artifacts-reusable.yml`'s `stage` job does the renaming, the counting and the
      # checksums once, for both pipelines, so a dev build publishes the same set a release does and
      # the two cannot drift apart again.
      #
      # `checksum.txt` arrives inside it, so `jmgilman/actions-generate-checksum` is gone with the
      # collection. Its output listed each file as `continuous/<name>`; the shared one lists bare
      # names, which is what every tagged release has always carried.
      - name: Download the staged release assets
        uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: release-assets
          path: continuous

      # Moves the rolling `continuous` tag on FORGEJO. It was `richardsimko/update-tag` with
      # `secrets.GITHUB_TOKEN` -- a GitHub action moving a GitHub tag, which is the wrong forge now, and a
      # bare reference that would not resolve against DEFAULT_ACTIONS_URL anyway.
      #
      # It matters more than it looks: the release below is created against tag `continuous`, and the
      # source archives are fetched from /archive/continuous.zip. If the tag does not move, every dev build
      # publishes fresh assets under a stale tag, with source archives of a different commit.
      - name: Move the continuous tag
        env:
          FORGEJO_ACTOR: ${{ secrets.FJ_ACTOR }}
          FORGEJO_TOKEN: ${{ secrets.FJ_TOKEN }}
        run: |
          set -eu
          auth=$(printf '%s:%s' "$FORGEJO_ACTOR" "$FORGEJO_TOKEN" | base64 | tr -d '\n')
          git tag -f continuous "${{ github.sha }}"
          git -c http.extraheader="Authorization: Basic ${auth}" \
            push --force "https://git.griefed.de/Griefed/ServerPackCreator.git" refs/tags/continuous
          echo "continuous now points at ${{ github.sha }}"

      - name: Get build timestamp
        id: build_time
        run: echo "timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      # The rolling release lives on FORGEJO, so the API calls below are hand-rolled rather than an
      # action aimed at GitHub. Delete-then-recreate rather than update: that is the only way to be
      # certain the preceding build's assets are gone.
      #
      # The JSON payload is built by python from environment variables, not by shell interpolation -- the
      # body contains backticks, emoji and newlines, and quoting that by hand in YAML is a trap.
      - name: Refresh the Forgejo continuous release
        id: forgejo_release
        env:
          TOKEN: ${{ secrets.FJ_TOKEN }}
          API: https://git.griefed.de/api/v1/repos/Griefed/ServerPackCreator
          TIMESTAMP: ${{ steps.build_time.outputs.timestamp }}
          COMMIT: ${{ github.sha }}
        run: |
          # pipefail matters here: every API call below is `curl | python3`, and without it the pipeline
          # reports PYTHON's status, so a curl that failed is invisible and surfaces as a parse error.
          set -eu -o pipefail
          OLD=$(curl -s "$API/releases/tags/continuous" -H "Authorization: token $TOKEN" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('id') or '')" 2>/dev/null || true)
          if [ -n "$OLD" ]; then
            echo "Deleting previous Forgejo continuous release $OLD (the tag is kept)"
            HTTP=$(curl -s -o delete.out -w '%{http_code}' -X DELETE "$API/releases/$OLD" \
                     -H "Authorization: token $TOKEN")
            if [ "$HTTP" != "204" ]; then
              echo "::error::deleting release $OLD answered HTTP $HTTP"
              cat delete.out || true
              exit 1
            fi
          fi
          python3 - > payload.json <<'PY'
          import json, os
          body = (
              "## \U0001F504 Continuous Dev-Build\n\n"
              f"**Built:** {os.environ['TIMESTAMP']}\n"
              f"**Commit:** `{os.environ['COMMIT']}`\n\n---\n\n"
              "This is an automated development build, updated every time changes are pushed to `develop`.\n\n"
              "\u26A0\uFE0F **Warning:** Do not use unless you have been told to, or are curious about the "
              "contents of the dev build.\n\n"
              "\U0001F6AB **Do not link to this release.**\n"
          )
          print(json.dumps({"tag_name": "continuous", "target_commitish": "develop",
                            "name": "continuous", "body": body,
                            "draft": False, "prerelease": True}))
          PY
          # NOT `curl -sf | python3`. `-f` makes curl print NOTHING on an HTTP error, so the API's own
          # explanation is discarded and json.load reports `Expecting value: line 1 column 1` -- a
          # traceback that names neither the status nor the reason. Capture both instead.
          HTTP=$(curl -s -o release.json -w '%{http_code}' -X POST "$API/releases" \
                   -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
                   -d @payload.json)
          if [ "$HTTP" != "201" ]; then
            echo "::error::creating the continuous release answered HTTP $HTTP"
            cat release.json || true
            exit 1
          fi
          ID=$(python3 -c 'import json;print(json.load(open("release.json"))["id"])')
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          for f in continuous/*; do
            curl -sf -X POST "$API/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f" > /dev/null
            echo "Forgejo <- $(basename "$f")"
          done

      # Asked for explicitly: clear GitHub's stale continuous RELEASE but leave its TAG alone, so the
      # mirror below recreates it from Forgejo rather than fighting a half-updated entry.
      - name: Delete the GitHub continuous release, keeping the tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          ID=$(curl -s "https://api.github.com/repos/Griefed/ServerPackCreator/releases/tags/continuous" \
                 -H "Authorization: Bearer $GH_TOKEN" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('id') or '')" 2>/dev/null || true)
          if [ -n "$ID" ]; then
            curl -sf -X DELETE "https://api.github.com/repos/Griefed/ServerPackCreator/releases/$ID" \
              -H "Authorization: Bearer $GH_TOKEN"
            echo "Deleted GitHub release $ID; the 'continuous' tag is untouched"
          else
            echo "No GitHub continuous release to delete"
          fi

      - name: Mirror the continuous release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          ID=$(curl -sf -X POST "https://api.github.com/repos/Griefed/ServerPackCreator/releases" \
                 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                 -d '{"tag_name":"continuous","name":"continuous","prerelease":true,"body":"Mirrored from https://git.griefed.de/Griefed/ServerPackCreator/releases/tag/continuous"}' \
               | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          for f in continuous/*; do
            curl -sf -X POST \
              "https://uploads.github.com/repos/Griefed/ServerPackCreator/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$f" > /dev/null
            echo "GitHub <- $(basename "$f")"
          done

      - name: Get source archives
        run: |
          wget -O continuous/source.zip    https://git.griefed.de/Griefed/ServerPackCreator/archive/continuous.zip
          wget -O continuous/source.tar.gz https://git.griefed.de/Griefed/ServerPackCreator/archive/continuous.tar.gz

      - name: Cleanup continuous on server
        uses: https://github.com/tiyee/action-ssh@v1.0.1
        with:
          host: ${{ secrets.SPCUPLOAD_HOST }}
          username: ${{ secrets.SPCUPLOAD_USERNAME }}
          privateKey: ${{ secrets.SPCUPLOAD_KEY }}
          command: 'rm -rf ~/spc/continuous'

      - name: Upload to server
        uses: https://github.com/nogsantos/scp-deploy@v1.3.0
        with:
          src: ./continuous
          host: ${{ secrets.SPCUPLOAD_HOST }}
          remote: "${{ secrets.SPCUPLOAD_TARGET }}"
          user: ${{ secrets.SPCUPLOAD_USERNAME }}
          key: ${{ secrets.SPCUPLOAD_KEY }}