# Documentation: the Writerside webhelp bundle and its container images.
# Replaces GitLab's `Writerside Build` and the three `Writerside Docker*` jobs.
#
# GitLab Pages hosted the rendered site; Forgejo has no equivalent, so the webhelp ships as a container
# image (`serverpackcreator-help`), which those Docker jobs were already publishing. The dokka HTML that
# the GitLab `pages` job served is attached to the release by release-build.yml instead.
name: Documentation

# GitLab had three Writerside Docker jobs: two for tags (`:<version>` and, for a full release, `:latest`)
# and one with the *inverse* rules that published `:<short-sha>` on ordinary pipelines. All three are here;
# the non-tag case is kept rather than dropped, because a docs image per commit is how the help site gets
# previewed before a release.
on:
  push:
    branches:
      - main
      - alpha
      - beta
      - develop
    tags:
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  writerside:
    name: "Writerside webhelp"
    runs-on: ubuntu-latest
    # NO `container:` HERE -- same reason as qodana.yml. act runs JavaScript actions by exec'ing `node`
    # INSIDE the job container, so checkout and upload-artifact fail with exit 127 in any tool image that
    # lacks node. This job DID fail that way (run 133) before the builder moved into a `docker run`.
    env:
      ARTIFACT: webHelpSPCH2-all.zip
      INSTANCE: Writerside/spch
    steps:

      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # The root-level documents are the source of truth and get copied into the help module, exactly as
      # the GitLab job did -- Writerside cannot reach outside its own directory.
      - name: Stage documents and images
        run: |
          cp -f img/*.png            serverpackcreator-help/Writerside/topics/img/ || true
          cp -f img/*.webp           serverpackcreator-help/Writerside/topics/img/ || true
          cp -f img/*.gif            serverpackcreator-help/Writerside/topics/img/ || true
          cp -f CHANGELOG.md         serverpackcreator-help/Writerside/topics/CHANGELOG.md
          cp -f CODE_OF_CONDUCT.md   serverpackcreator-help/Writerside/topics/CODE_OF_CONDUCT.md
          cp -f CONTRIBUTING.md      serverpackcreator-help/Writerside/topics/CONTRIBUTING.md
          cp -f HELP.md              serverpackcreator-help/Writerside/topics/HELP.md
          cp -f LICENSE              serverpackcreator-help/Writerside/topics/LICENSE.md
          cp -f README.md            serverpackcreator-help/Writerside/topics/README.md
          cp -f SECURITY.md          serverpackcreator-help/Writerside/topics/SECURITY.md

      # `--runner gitlab` became wrong with the forge change; the flag only labels the environment in the
      # report, so `other` is accurate and avoids claiming a runner that no longer exists.
      # The builder runs in its own container rather than as the job's container. Under docker-in-docker a
      # `-v "$PWD:/workspace"` bind is resolved by the DIND daemon, whose filesystem holds no copy of the
      # job's workspace -- verified 2026-08-22 against docker:dind, the sibling saw an EMPTY directory and
      # still exited 0, so the build would have silently produced nothing. `--volumes-from` inherits the
      # job container's own workspace volume instead, which makes $PWD name the same files on both sides.
      # THIS REQUIRES the runner's `container.options` to mount a volume at the workspace parent
      # (`-v /workspace`); without it the workspace is ordinary container filesystem and nothing
      # propagates. INSTANCE is passed with -e because the outer shell must not expand it -- the inner
      # script needs it, and $PWD in that single-quoted script expands inside the builder, where -w set it.
      - name: Build webhelp
        run: |
          set -e
          mkdir -p public
          docker run --rm \
            --volumes-from "$(cat /etc/hostname)" \
            -w "$PWD" \
            -e INSTANCE \
            --entrypoint bash \
            jetbrains/writerside-builder:2026.02.8644 \
            -c 'rm -f /tmp/.X99-lock || true
                export DISPLAY=:99
                Xvfb :99 &
                /opt/builder/bin/idea.sh helpbuilderinspect \
                  -source-dir "$PWD/serverpackcreator-help" \
                  -product "$INSTANCE" --runner other -output-dir "$PWD/public/" || true'
          chown -R "$(id -u):$(id -g)" public 2>/dev/null || true
          echo "Test existing of $ARTIFACT artifact"
          test -e "public/$ARTIFACT"

      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5, Forgejo's GHES-patched fork
        with:
          name: writerside-webhelp
          path: |
            public/${{ env.ARTIFACT }}
            public/report.json
          if-no-files-found: error

  help-image:
    name: "Help image"
    needs: writerside
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7, Forgejo's GHES-patched fork
        with:
          name: writerside-webhelp
          path: public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One job replacing three. GitLab needed a separate job per tag set because its rules are per-job;
      # here the tag list is computed, and `latest` is still reserved for a full release.
      # Three GitLab jobs collapse into this one computation:
      #   full release  -> :<version> and :latest
      #   prerelease    -> :<version>
      #   branch push   -> :<short-sha>   (what the inverse-rules job did)
      - name: Compute tags
        id: tags
        run: |
          U="${{ secrets.DOCKERHUB_USER }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          else
            V="$(echo "${{ github.sha }}" | cut -c1-8)"
          fi
          TAGS="ghcr.io/$U/serverpackcreator-help:$V,index.docker.io/$U/serverpackcreator-help:$V"
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="$TAGS,ghcr.io/$U/serverpackcreator-help:latest,index.docker.io/$U/serverpackcreator-help:latest"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile.help
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
