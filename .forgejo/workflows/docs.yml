# Documentation: the Writerside webhelp bundle, the Kotlin API reference, and the site that serves both.
# Replaces GitLab's `Writerside Build` and the three `Writerside Docker*` jobs.
#
# EVERYTHING THIS WORKFLOW RENDERS IS SERVED BY serverpackcreator.de, out of the `homepage-image` job
# at the bottom -- the help at `/help/latest`, the API reference at `/api/<version>/`. There is no
# `serverpackcreator-help` container any more: it was how the webhelp got hosted when GitLab Pages
# went away and Forgejo had no equivalent, and once the homepage served the help it had no reader
# left except the assembly step, which extracted a 62 MB image per version to take 4 MB out of it.
#
# The dokka HTML the GitLab `pages` job served has THREE homes, deliberately different things rather
# than duplicates: a release asset (`release-build.yml`, versioned and downloadable), `/api/<version>/`
# on the homepage (the `dokka` job below), and GitHub Pages (`.github/workflows/pages.yml`, which
# exists because Pages can only be deployed from GitHub and Forgejo still has none).
name: Documentation and homepage

# The non-tag case is kept rather than dropped, because a site image per commit is how the documentation
# gets previewed -- and now deployed against -- before a release.
on:
  push:
    branches:
      - main
      - alpha
      - beta
      - develop
    tags:
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE definition of what this build calls itself, because four jobs need it and they must agree.
  # It used to live only in the tag computation of the job that published the help image, which is
  # why the Dokka tree was built with no `-Pversion` at all: the job that builds it cannot read
  # another job's step outputs. An artifact named `9.2.1` whose API reference says `dev` is the result.
  version:
    name: "Version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      # Whether this build is a prerelease, decided ONCE here and read by everything downstream.
      # It used to be re-derived twice -- a `case` in `Compute tags` and a regex in
      # `assemble-docs.sh` -- which is two copies of a question `resolve-version` already answers.
      prerelease: ${{ steps.out.outputs.prerelease }}
    steps:
      # Needed only because `resolve-version` is a local action: a local action's files arrive with
      # the checkout, which is why this cannot live inside it.
      - uses: actions/checkout@v7

      # A TAG GOES THROUGH `resolve-version`, which is the whole point of this step. That action is
      # the one place that decides what a build calls itself, and its `tag` mode REFUSES anything
      # that is neither `X.Y.Z` nor `X.Y.Z-(alpha|beta).N` so a stray tag cannot half-release.
      # `release-build.yml` and `devbuild.yml` both use it; this workflow hand-rolled `V=ref_name`
      # instead and so had no refusal at all. Its `tags: ['*.*.*']` filter compiles to
      # `^.*\..*\..*$`, which `v9.2.2`, `test.tag.x` and `release.candidate.1` all match -- each
      # would have been taken verbatim as the version, publishing a site image tagged `<junk>` whose
      # help links an API reference at `/api/<junk>/`.
      - name: Resolve a tag
        id: tag
        if: ${{ github.ref_type == 'tag' }}
        uses: ./.forgejo/actions/resolve-version
        with:
          mode: tag

      # A BRANCH BUILD IS NAMED BY ITS COMMIT, deliberately NOT by `resolve-version`'s `branch` mode:
      # that mode needs `fetch-depth: 0` for `git describe`, and this job exists to hand one short
      # string to three others. A branch build publishes `<short-sha>` rather than a version, which
      # `Compute tags` relies on: only a `prerelease=false` build may ever become `:latest`.
      - name: Compose the version
        id: out
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          TAG_PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -eu
          if [ -n "${TAG_VERSION:-}" ]; then
            V="$TAG_VERSION"
            PRE="$TAG_PRERELEASE"
          else
            V="$(echo "$GITHUB_SHA" | cut -c1-8)"
            PRE=true
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Building the documentation as $V (prerelease: $PRE)"

  writerside:
    name: "Writerside webhelp"
    needs: version
    runs-on: ubuntu-latest
    # Skip the push that *creates* `alpha`/`beta`: Forgejo fires `push` for a new ref as well as
    # `create`, and such a branch carries main's state, which `main` has already tested. On a new ref
    # `github.event.before` is the all-zero object id — Forgejo's push payload has no `created` field,
    # so GitHub's `github.event.created == false` cannot be used here. See .claude/rules/ci-workflows.md.
    if: ${{ github.event_name != 'push' || !(startsWith(github.event.before, '0000000000000000') && (github.ref_name == 'alpha' || github.ref_name == 'beta')) }}
    # NO `container:` HERE -- same reason as qodana.yml. act runs JavaScript actions by exec'ing `node`
    # INSIDE the job container, so checkout and upload-artifact fail with exit 127 in any tool image that
    # lacks node. The builder therefore runs as a `docker run` from an ordinary runner image.
    env:
      ARTIFACT: webHelpSPCH2-all.zip
      INSTANCE: Writerside/spch
    steps:

      - uses: actions/checkout@v7

      # The root-level documents are the source of truth and get copied into the help module, exactly as
      # the GitLab job did -- Writerside cannot reach outside its own directory.
      - name: Stage documents and images
        run: |
          cp -f img/*.png            serverpackcreator-help/Writerside/topics/img/ || true
          cp -f img/*.webp           serverpackcreator-help/Writerside/topics/img/ || true
          cp -f img/*.gif            serverpackcreator-help/Writerside/topics/img/ || true
          cp -f CHANGELOG.md         serverpackcreator-help/Writerside/topics/CHANGELOG.md
          cp -f CODE_OF_CONDUCT.md   serverpackcreator-help/Writerside/topics/CODE_OF_CONDUCT.md
          cp -f CONTRIBUTING.md      serverpackcreator-help/Writerside/topics/CONTRIBUTING.md
          cp -f HELP.md              serverpackcreator-help/Writerside/topics/HELP.md
          cp -f LICENSE              serverpackcreator-help/Writerside/topics/LICENSE.md
          cp -f README.md            serverpackcreator-help/Writerside/topics/README.md
          cp -f SECURITY.md          serverpackcreator-help/Writerside/topics/SECURITY.md

      # `--runner other`: the flag only labels the environment in the report, and `other` is what this is.
      # The builder runs in its own container rather than as the job's container. Under docker-in-docker a
      # `-v "$PWD:/workspace"` bind is resolved by the DIND daemon, whose filesystem holds no copy of the
      # job's workspace -- the sibling sees an EMPTY directory and still exits 0, so the build silently
      # produces nothing. `--volumes-from` inherits the
      # job container's own workspace volume instead, which makes $PWD name the same files on both sides.
      # THIS REQUIRES the runner's `container.options` to mount a volume at the workspace parent
      # (`-v /workspace`); without it the workspace is ordinary container filesystem and nothing
      # propagates. INSTANCE is passed with -e because the outer shell must not expand it -- the inner
      # script needs it, and $PWD in that single-quoted script expands inside the builder, where -w set it.
      # The help site's "Kotlin API (Dokka)" entry is an ABSOLUTE URL and has to be: the published
      # webhelp is a single-page app whose viewer only navigates an href carrying a scheme, so a
      # relative or root-absolute one is client-side routed and dies on "TOC data error". The long
      # comment above that entry in `spch.tree` has the whole story.
      #
      # It is absolute AND per-version here. The help itself is not versioned -- serverpackcreator.de
      # serves exactly one copy, at /help/latest -- but the reference it links IS, so the link has to
      # name the version this bundle was rendered alongside. /help/latest sending a reader to a
      # reference built from a different commit is worse than no link.
      #
      # The in-repo value stays the GitHub Pages URL, which is what `pages.yml` wants and is why that
      # workflow needs no substitution at all. This rewrites it only for the bundle
      # serverpackcreator.de serves.
      #
      # ASSERTED, because a wrong href is a dead click rather than a failed build: `sed` matching
      # nothing exits 0 and would ship the Pages link silently.
      - name: Point the API entry at this version
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          TREE=serverpackcreator-help/Writerside/spch.tree
          FROM="https://griefed.github.io/ServerPackCreator/api/index.html"
          TO="https://serverpackcreator.de/api/$V/index.html"
          grep -qF "$FROM" "$TREE" || {
            echo "::error::$TREE no longer contains $FROM -- the Dokka entry moved, and this"
            echo "::error::substitution would have silently left the published help pointing elsewhere."
            exit 1
          }
          sed -i "s|$FROM|$TO|" "$TREE"
          grep -qF "$TO" "$TREE"
          echo "API entry -> $TO"

      - name: Build webhelp
        run: |
          set -e
          mkdir -p public
          docker run --rm \
            --volumes-from "$(cat /etc/hostname)" \
            -w "$PWD" \
            -e INSTANCE \
            --entrypoint bash \
            jetbrains/writerside-builder:2026.02.8644 \
            -c 'rm -f /tmp/.X99-lock || true
                export DISPLAY=:99
                Xvfb :99 &
                /opt/builder/bin/idea.sh helpbuilderinspect \
                  -source-dir "$PWD/serverpackcreator-help" \
                  -product "$INSTANCE" --runner other -output-dir "$PWD/public/" || true'
          chown -R "$(id -u):$(id -g)" public 2>/dev/null || true
          echo "Test existing of $ARTIFACT artifact"
          test -e "public/$ARTIFACT"

      # The substitution above edits the SOURCE; this proves it reached the OUTPUT. Writerside
      # rewrites hrefs as it builds, so "the tree said so" is not evidence the bundle does.
      - name: Check the API entry survived the build
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          # `unzip` is NOT a given on this runner image -- that is why the dokka job ships a tar.gz,
          # and why `assemble-docs.sh` reaches for python3 the same way. python3 is the fallback here
          # too, and if neither is present the check SKIPS loudly rather than passing: a check that
          # cannot run must not read as one that did.
          if command -v unzip >/dev/null; then
            unzip -p "public/$ARTIFACT" HelpTOC.json > toc.json
          elif command -v python3 >/dev/null; then
            python3 -c "import zipfile,sys; open('toc.json','wb').write(zipfile.ZipFile(sys.argv[1]).read('HelpTOC.json'))" "public/$ARTIFACT"
          else
            echo "::warning::neither unzip nor python3 is available -- the published API link is UNVERIFIED"
            exit 0
          fi
          if ! grep -qF "https://serverpackcreator.de/api/$V/index.html" toc.json; then
            echo "::error::the built HelpTOC.json does not carry the versioned API URL."
            grep -oE 'https?://[^"]*api[^"]*' toc.json | sort -u || true
            exit 1
          fi
          echo "built TOC links the API reference at /api/$V/"

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: writerside-webhelp
          path: |
            public/${{ env.ARTIFACT }}
            public/report.json
          if-no-files-found: error

  # The Kotlin API reference the site serves at `/api/<version>/`. Writerside cannot host a generated file
  # tree of its own (WRS-1772 is open), which is why this is a separate tree beside the help rather than a
  # page inside it, and why the help's TOC reaches it by absolute URL. A job of its own rather than a step
  # in `writerside`: the two are independent, so they run in parallel, and the Writerside job stays
  # checkout-plus-docker with no JDK in it. `release-build.yml` runs the same task for its
  # `dokka-html.zip` release asset, which is where every version but this one is fetched from.
  dokka:
    name: "Dokka HTML"
    needs: version
    runs-on: ubuntu-latest
    # Same new-ref guard as `writerside` above -- see the comment there.
    if: ${{ github.event_name != 'push' || !(startsWith(github.event.before, '0000000000000000') && (github.ref_name == 'alpha' || github.ref_name == 'beta')) }}
    steps:

      - uses: actions/checkout@v7

      - uses: ./.forgejo/actions/setup-build

      # `dokkaGenerateHtml`, not `dokkaJavadocJar`: the HTML publication is what the site serves -- the
      # published site is Dokka HTML, not the Javadoc format. Around 1411 files / 20 MB.
      # Note the task WIPES `build/dokka` before writing, so
      # the Javadoc publication's `build/dokka/javadoc` does not survive alongside it -- which is why the
      # upload below can take the whole directory without picking up a second, differently-shaped tree.
      # `-Pversion` is not optional here. Without it the tree is built at `gradle.properties`'
      # `version=dev`, so the 9.2.1 build shipped an API reference labelled `dev`.
      # `pages.yml` and `artifacts-reusable.yml` have always passed it; this job had not.
      - name: Build the Kotlin API reference
        run: ./gradlew :serverpackcreator-api:dokkaGenerateHtml -Pversion="${{ needs.version.outputs.version }}" --full-stacktrace

      # ONE file instead of 1411. The artifact API uploads and downloads each file individually, so the
      # tree crosses the wire twice at 1411 requests a side; a single blob is one request each way.
      # Measured on this tree: 1411 files / 20,288 KiB raw -> 1,308 KiB as tar.gz.
      #
      # tar.gz, NOT zip, for two reasons. `unzip` is not a given on the runner image -- which is why
      # `writerside`'s TOC check can skip and why `assemble-docs.sh` carries a python3 fallback --
      # whereas `tar` is present anywhere `actions/checkout` runs. And gzip compresses ACROSS
      # members where zip compresses each separately, which on a tree of near-identical HTML is the whole
      # difference: the same content zips to 4,376 KiB, 3.3x the tar.gz. The release asset stays a `.zip`
      # (`release-build.yml`) because that one is downloaded by humans on Windows; this one is read only
      # by the next job.
      - name: Pack the reference
        run: |
          set -e
          test -d serverpackcreator-api/build/dokka
          tar -czf dokka-html.tar.gz -C serverpackcreator-api/build/dokka .
          ls -lh dokka-html.tar.gz

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        with:
          name: dokka-html
          path: dokka-html.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------------
  # serverpackcreator.de. Here rather than in a workflow of its own because the site SERVES what the
  # jobs above produce: `homepage-image` assembles /help/latest and /api/<version>/ out of the
  # `writerside` and `dokka` artifacts, which only exist inside this run.
  homepage-build:
    name: "Homepage: Quasar build"
    defaults:
      run:
        working-directory: serverpackcreator-homepage
    runs-on: ubuntu-latest
    # Same new-ref guard as every other job here, and NOTHING ELSE. The website's own CI skipped
    # `RELEASE:` commits, because there semantic-release's commit would have re-triggered its own
    # pipeline. Carried over unchanged it does the opposite of what it did: a ServerPackCreator
    # release tag SITS ON a `RELEASE:` commit, so the clause skipped this job exactly when a release
    # happened -- and `homepage-image` needs it, so no release would ever have published a site.
    if: ${{ github.event_name != 'push' || !(startsWith(github.event.before, '0000000000000000') && (github.ref_name == 'alpha' || github.ref_name == 'beta')) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The published image's builder stage ships Node 22 and compiles this tree cleanly, so 22
          # is the verified-good version rather than the optimistic one.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: serverpackcreator-homepage/package-lock.json

      - run: npm install

      # BEFORE the Quasar build, deliberately: this runs `docs/assemble-docs.test.sh`, which stands up
      # a loopback http.server and exercises the assembly end to end in a couple of seconds, so a
      # broken script fails here rather than after a four-minute SPA build. It needs no Docker daemon
      # and no network, which is the whole reason the assembly stopped reading a container image.
      - name: Verify the documentation assembly
        run: npm test

      - run: rm -Rf dist
      - run: npx quasar build

      # The SPA is the thing this workflow exists to produce; a build that emits nothing must fail
      # here rather than ship an empty image.
      - name: Check the build produced a site
        run: test -s dist/spa/index.html

      # The manifest is checked HERE, in the cheap job, because reading it costs nothing while the
      # assembly that depends on it pulls an image per version -- a `latest` naming no listed version
      # is the mistake worth catching before the expensive job starts, and before a tag is cut.
      - name: Check the documentation manifest
        run: |
          node -e '
            const m = require("./docs/versions.json");
            if (!m.latest || !Array.isArray(m.versions)) throw new Error("versions.json needs latest + versions[]");
            if (!m.versions.includes(m.latest)) throw new Error(`latest ${m.latest} is not in [${m.versions}]`);
            console.log(`docs manifest OK: latest=${m.latest} of [${m.versions}]`);
          '

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: homepage-spa
          path: serverpackcreator-homepage/dist/spa
          retention-days: 7

  homepage-image:
    name: "Homepage: image"
    # `writerside` and `dokka` are reached through `needs:` rather than only by artifact name: a
    # download-artifact of a job this one does not depend on resolves against whatever the run
    # happens to have finished, which on a cancelled or re-run job is nothing at all.
    needs: [version, writerside, dokka, homepage-build]
    defaults:
      run:
        working-directory: serverpackcreator-homepage
    # Published on every push: an image per commit is how the site gets previewed -- and now
    # deployed against -- before a release. The guard is the same new-ref one the rest of this workflow
    # carries, and nothing else here needed a branch/tag distinction:
    #
    #   `Compute tags` appends `:latest` only when the `version` job reports `prerelease=false`, and
    #   `resolve-version` hard-sets that true for every branch build. So a branch publishes
    #   `<branch>-<short-sha>` (`git describe` on main) and CANNOT produce `:latest`.
    #
    #   `SPC_RELEASE_IS_LATEST` below reads that same answer, so `/api/latest` keeps naming the newest
    #   RELEASE. This commit's API reference is browsable at `/api/<branch>-<short-sha>/` beside every
    #   version `versions.json` lists, which is what makes a preview behave like production instead of
    #   like a one-version stub. The help is not versioned at all -- `/help/latest` is this build's.
    if: ${{ github.event_name != 'push' || !(startsWith(github.event.before, '0000000000000000') && (github.ref_name == 'alpha' || github.ref_name == 'beta')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute tags
        id: tags
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          V="${{ needs.version.outputs.version }}"
          PRERELEASE="${{ needs.version.outputs.prerelease }}"
          U="${{ secrets.DOCKERHUB_USER }}"
          R="${{ vars.DOCKERHUB_HOMEPAGE_REPO }}"
          : "${R:=serverpackcreator-de}"
          TAGS="ghcr.io/$U/$R:$V,index.docker.io/$U/$R:$V"
          # `:latest` only for a full release -- a prerelease tag must never become what a bare
          # `docker pull` returns. The answer comes from the `version` job, which got it from
          # `resolve-version`; re-deriving it here was the second of three copies of one question.
          if [ "$PRERELEASE" = "false" ]; then
            TAGS="$TAGS,ghcr.io/$U/$R:latest,index.docker.io/$U/$R:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: ./.forgejo/actions/registry-login
        with:
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          ghcr-token: ${{ secrets.GH_TOKEN }}

      # This version's API reference, out of THIS workflow's dokka job rather than off a release
      # asset, and it is load-bearing on both paths. On a tag, `release-build.yml` uploads that asset
      # from a separate workflow on the same tag, so at this moment it may not exist yet. On a branch
      # there is no release named `<branch>-<short-sha>` and never will be, so this artifact is the
      # ONLY source. `assemble-docs.sh` prefers an api/<version>/ that is already populated, which is
      # all it takes to serve both.
      - uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: dokka-html
          path: ${{ github.workspace }}

      # The help the site serves, straight from the job that rendered it. There is no archive of
      # older renderings to fall back on and deliberately none: `/help/latest` is the only help URL
      # the site offers, so the build that is running is the only source there needs to be.
      - uses: https://code.forgejo.org/forgejo/download-artifact@v7  # Forgejo's GHES-patched fork
        with:
          name: writerside-webhelp
          path: ${{ github.workspace }}/webhelp

      - name: Seed this version's API reference from the build
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p "docs-build/api/$V"
          tar -xzf "$GITHUB_WORKSPACE/dokka-html.tar.gz" -C "docs-build/api/$V"
          # Not decoration: `COPY docs-build/` would happily ship a directory that unpacked empty,
          # and the site's /api/<version>/ would be a 404 behind a link the TOC advertises.
          test -s "docs-build/api/$V/index.html"
          echo "seeded api/$V with $(find "docs-build/api/$V" -type f | wc -l) files"

      # Assembled BEFORE the image build, because the API reference of every version but this one is
      # fetched over the network and a Dockerfile has nowhere to put a download. The Dockerfile
      # refuses to build without the result, so a skipped step here fails the build instead of
      # publishing a site whose /help and /api are 404s.
      #
      # SPC_RELEASE_VERSION is what puts the release being published into the site at all: the
      # checked-in manifest is hand-edited and the tag is cut afterwards, so it can never name the
      # version it is being built for. Without it every release shipped an API reference one release
      # stale, with `/api/latest` pointing at its predecessor -- and did so on a green pipeline.
      - name: Assemble the versioned documentation
        env:
          SPC_WEBHELP_ZIP: ${{ github.workspace }}/webhelp/webHelpSPCH2-all.zip
          SPC_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          # The third copy of "is this a plain release?", now a read rather than a derivation.
          SPC_RELEASE_IS_LATEST: ${{ needs.version.outputs.prerelease == 'false' }}
        run: docs/assemble-docs.sh docs-build

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./serverpackcreator-homepage
          file: ./serverpackcreator-homepage/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: ${{ steps.tags.outputs.tags }}
