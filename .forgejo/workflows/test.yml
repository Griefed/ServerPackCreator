# Gradle build + test. This is the canonical CI for the project, replacing GitLab's `Build Test`.
#
# NOTE ON `uses:` REFERENCES, here and in every workflow in this directory: they are the same
# `actions/...@<github-sha>` lines the .github workflows use. Forgejo's docs recommend fully-qualified
# `https://data.forgejo.org/...` URLs instead, but these exact references are *proven* to resolve on this
# instance -- they are what built releases 9.0.0-alpha.2 through .6 while Forgejo was reading
# .github/workflows. Switching them to a mirror whose commit SHAs may differ would trade something known
# to work for something merely recommended.
#
# THE ARTIFACT ACTIONS ARE THE ONE EXCEPTION, and not by preference. Upstream upload-artifact@v4+ and
# download-artifact@v4+ call `isGhes()` and abort with `GHESNotSupportedError` on any host that is not
# github.com, so every upload in this directory died -- test.yml, docs.yml and devbuild.yml all failed
# that way, after the step had already found and staged the files. It is a client-side refusal, not a
# missing API on the instance, and no runner or instance setting turns it off. Forgejo maintains patched
# forks whose `isGhes()` is `return false` -- verified 2026-08-22 by reading `dist/upload/index.js` and
# `dist/index.js` at the pinned commits -- so those two references point at code.forgejo.org, pinned by
# commit like every other action here. `.github/workflows` keeps the upstream actions: on GitHub the
# check is correct and the forks are unnecessary. The forks lag upstream (upload v5 vs v7, download v7
# vs v8); every input this directory passes -- name, path, if-no-files-found, retention-days -- exists in
# those versions.
name: Test

# NOTE: no `permissions:` block anywhere in this directory. Forgejo does not implement the field --
# the runner warns "has a permissions field, which is not supported in Forgejo and will be ignored"
# once per job -- so declaring it bought nothing but noise and a false sense of hardening. Capability
# scoping on Forgejo is done per job with Authorized Integrations, configured on the instance rather
# than in the workflow. `.github/workflows` keeps its permissions blocks: GitHub honours them.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "build"
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: wrapper

      - name: Set Permissions
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew -Pversion="${{ github.ref_name }}" build --info --full-stacktrace

      # GitLab rendered `reports: junit:` in its UI; Forgejo has no equivalent, so the XML is uploaded
      # instead. Kept separate from the build artifact so a failed run still yields readable results
      # without downloading the whole build directory.
      - name: Upload test results
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5, Forgejo's GHES-patched fork
        if: ${{ always() }}
        with:
          name: test-results
          path: |
            serverpackcreator-api/build/test-results/test/TEST-*.xml
            serverpackcreator-app/build/test-results/test/TEST-*.xml
            serverpackcreator-clientside/build/test-results/test/TEST-*.xml
            serverpackcreator-grinder/build/test-results/test/TEST-*.xml
            serverpackcreator-plugin-example/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          # Deletion is automatic and server-side: the artifact carries this expiry, and Forgejo's
          # `cron.cleanup_actions` job (ENABLED true, SCHEDULE @midnight by default) removes what has
          # expired. Without this the instance default of ARTIFACT_RETENTION_DAYS applies -- 90 days --
          # on every push, which is not a retention policy so much as an accumulation one. A week is
          # deliberately longer than the build artifact below: these XMLs are small and are the thing
          # actually read after a failure, including one noticed the following Monday.
          retention-days: 7

      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5, Forgejo's GHES-patched fork
        if: ${{ always() }}
        with:
          name: build-artifacts
          path: |
            build
            buildSrc/build
            serverpackcreator-api/build
            serverpackcreator-app/build
            serverpackcreator-web-frontend/dist
            serverpackcreator-plugin-example/build
          if-no-files-found: warn
          # One day, matching devbuild.yml's convention for the same reason: this is whole build trees --
          # the run that surfaced the GHES refusal counted 5708 files -- and it is a convenience copy of
          # something any checkout can rebuild, not evidence. Nothing downstream consumes it, so no job
          # breaks when it goes.
          retention-days: 1
