# Gradle build + test. This is the canonical CI for the project, replacing GitLab's `Build Test`.
#
# NOTE ON `uses:` REFERENCES, here and in every workflow in this directory: they name a VERSION TAG,
# `actions/checkout@v6`, not a commit. A bare `owner/repo` resolves through the runner's configured
# default action URL, which on this instance is `https://data.forgejo.org` -- read out of the runners'
# own `git fetch 'https://data.forgejo.org/actions/checkout'` log lines, not from any file here. That
# mirror carries the major tags: `v1`..`v7` were confirmed present for every bare reference in this
# directory with `git ls-remote --tags`.
#
# WHAT THAT TRADES, stated plainly because it is a real cost: a tag is mutable. Upstream can repoint
# `v6` and the next push runs different code with no commit here, and `data.forgejo.org` is a mirror,
# so it is also trusting the mirror to stay in step. Griefed's call, 2026-10-03, after measuring that
# every major tag was already AHEAD of the commit it replaced -- i.e. the SHA pins had silently frozen
# eight actions at older releases, which is the other half of the same trade.
#
# FOUR REFERENCES ARE NOT A BARE MAJOR, each for its own checked reason:
#   - tiyee/action-ssh@v1.0.1 and nogsantos/scp-deploy@v1.3.0 publish NO `v1` tag or branch at all;
#     the exact version is the only tag that exists, and it is the commit that was pinned.
#   - luangong/setup-install4j@v1 and jmgilman/actions-generate-checksum@v1 resolve to a BRANCH
#     named `v1`, not a tag -- both currently at exactly the commit that was pinned. More mutable
#     than a tag, and still what each action's own README tells you to use.
#
# THE ARTIFACT ACTIONS ARE THE ONE EXCEPTION, and not by preference. Upstream upload-artifact@v4+ and
# download-artifact@v4+ call `isGhes()` and abort with `GHESNotSupportedError` on any host that is not
# github.com, so every upload in this directory died -- test.yml, docs.yml and devbuild.yml all failed
# that way, after the step had already found and staged the files. It is a client-side refusal, not a
# missing API on the instance, and no runner or instance setting turns it off. Forgejo maintains patched
# forks whose `isGhes()` is `return false` -- confirmed by reading `dist/upload/index.js` and
# `dist/index.js` -- so those two references point at code.forgejo.org. `.github/workflows` keeps the
# upstream actions: on GitHub the check is correct and the forks are unnecessary. The forks lag
# upstream (upload v5 vs v7, download v7 vs v8); every input this directory passes -- name, path,
# if-no-files-found, retention-days -- exists in those versions. They are referenced by tag like
# everything else here; `v5` and `v7` are the newest majors the forks publish.
name: Test

# NOTE: no `permissions:` block anywhere in this directory. Forgejo does not implement the field --
# the runner warns "has a permissions field, which is not supported in Forgejo and will be ignored"
# once per job -- so declaring it bought nothing but noise and a false sense of hardening. Capability
# scoping on Forgejo is done per job with Authorized Integrations, configured on the instance rather
# than in the workflow. `.github/workflows` keeps its permissions blocks: GitHub honours them.

# NO `pull_request:` TRIGGER. Every PR on this instance is opened from a branch of this repository, and
# `push:` already builds those commits, so adding it would run this workflow twice per push for a second
# verdict on the same tree, in parallel, on one runner.
#
# Two things that costs: the *merge* result is not built on its own, so a PR green on its head can still
# conflict semantically with its base until the merge lands and is built there; and a fork PR gets no
# Forgejo CI, which `.github/workflows/test.yml` covers instead -- GitHub is where a fork arrives.
on:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "build"
    runs-on: ubuntu-latest
    # Skip the push that *creates* `alpha`/`beta`: Forgejo fires `push` for a new ref as well as
    # `create`, and such a branch carries main's state, which `main` has already tested. On a new ref
    # `github.event.before` is the all-zero object id — Forgejo's push payload has no `created` field,
    # so GitHub's `github.event.created == false` cannot be used here. See .claude/rules/ci-workflows.md.
    if: ${{ github.event_name != 'push' || !(startsWith(github.event.before, '0000000000000000') && (github.ref_name == 'alpha' || github.ref_name == 'beta')) }}
    steps:

      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          check-latest: true
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Set Permissions
        run: chmod +x gradlew

      # The api's container-backed tests need these. `TemplateInterpreterRunner` copies the shipped
      # templates into a container and asks the real interpreter whether they parse -- busybox for the
      # transport guard, alpine for fish, the PowerShell image for `.ps1` -- because neither interpreter
      # is installed on this runner. Pulling up front keeps the pull out of a test's own timeout. The
      # runner has a working socket; qodana.yml and docs.yml already `docker run` from an ordinary
      # `runs-on: ubuntu-latest` job, which is the sanctioned shape (see .claude/rules/ci-workflows.md;
      # a `container:` of a tool image is the landmine, not docker itself).
      - name: Pull the images the container-backed tests use
        run: |
          docker pull busybox:latest
          docker pull alpine:latest
          docker pull mcr.microsoft.com/powershell:latest

      # GRINDER_DOCKER_IT is NOT set here, deliberately. The grinder's container tests live in
      # `grinder-container-it.yml`, which holds a repository-wide concurrency lock, because one of them
      # reaps every grinder-labelled container on the daemon while this workflow's per-ref group still
      # lets two branches share the runner. Setting it here would put that collision back. The other
      # GRINDER_*_IT gates stay unset because they need a live Modrinth/CurseForge API, a built image, or
      # a deployed grinder.
      - name: Build with Gradle
        run: ./gradlew -Pversion="${{ github.ref_name }}" build --info --full-stacktrace

      # GitLab rendered `reports: junit:` in its UI; Forgejo has no equivalent, so the XML is uploaded
      # instead. Kept separate from the build artifact so a failed run still yields readable results
      # without downloading the whole build directory.
      - name: Upload test results
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        if: ${{ always() }}
        with:
          name: test-results
          path: |
            serverpackcreator-api/build/test-results/test/TEST-*.xml
            serverpackcreator-app/build/test-results/test/TEST-*.xml
            serverpackcreator-clientside/build/test-results/test/TEST-*.xml
            serverpackcreator-grinder/build/test-results/test/TEST-*.xml
            # Globbed, so a new plugin module reports its results the day it lands. Named one by one,
            # this list stopped at example and grinder while servertest and selfextract were added --
            # 128 tests whose XML nobody could read after a failure.
            serverpackcreator-plugin-*/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          # Deletion is automatic and server-side: the artifact carries this expiry, and Forgejo's
          # `cron.cleanup_actions` job (ENABLED true, SCHEDULE @midnight by default) removes what has
          # expired. Without this the instance default of ARTIFACT_RETENTION_DAYS applies -- 90 days --
          # on every push, which is not a retention policy so much as an accumulation one. A week is
          # deliberately longer than the build artifact below: these XMLs are small and are the thing
          # actually read after a failure, including one noticed the following Monday.
          retention-days: 7

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5  # Forgejo's GHES-patched fork
        if: ${{ always() }}
        with:
          name: build-artifacts
          path: |
            build
            buildSrc/build
            serverpackcreator-api/build
            serverpackcreator-app/build
            serverpackcreator-web-frontend/dist
            serverpackcreator-plugin-example/build
          if-no-files-found: warn
          # One day, matching devbuild.yml's convention for the same reason: this is whole build trees --
          # the run that surfaced the GHES refusal counted 5708 files -- and it is a convenience copy of
          # something any checkout can rebuild, not evidence. Nothing downstream consumes it, so no job
          # breaks when it goes.
          retention-days: 1
