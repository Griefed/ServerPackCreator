name: Update README with blog posts and sponsors

# Runs on a schedule from here, and pushes to this repository's origin.
#
# The sponsor and contributor actions read GitHub's API, so they need a GitHub token even though the
# push target is Forgejo.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# The schedule and a manual dispatch can otherwise overlap, and both commit and push to main.
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    name: "Fetch and Generate Blog Posts"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: Griefed/ServerPackCreator
          ref: main

      - uses: https://github.com/release-kit/hash-files@v1
        id: get-current-hash
        with:
          patterns: |
            README.md
      - name: Current README hash
        run: echo ${{ steps.get-current-hash.outputs.hash }}

      # GH_TOKEN, not GITHUB_TOKEN: on Forgejo the latter is the automatically provided *Forgejo* token,
      # and both actions below query GitHub's API for sponsors and contributors. Handing them the wrong
      # forge's credential fails quietly -- an empty list committed over a populated one.
      #
      # The sponsors action cannot tell a rejected query from "this account has no sponsors": it returns
      # the GraphQL body unparsed, finds no `viewer` key under either outcome, writes its empty fallback
      # between the markers and exits 0. Asking the API here first is what turns a credential problem
      # into a red job rather than an empty sponsor block committed over a populated one.
      #
      # Sponsorship is an account-level relationship -- there is no per-repository sponsor list to ask
      # for -- so `viewer` resolves to whoever owns GH_TOKEN, and that account must be the one the
      # sponsors belong to.
      - name: Verify GH_TOKEN can read sponsorships
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          PROBE="$(mktemp)"
          # NOT `curl -sf`: -f prints nothing on an HTTP error, and GraphQL answers 200 with an `errors`
          # array for a scope rejection anyway, so the body is the only place the cause ever appears.
          #
          # The query below is the sponsors action's OWN query, field for field -- `src/template.ts` in
          # JamesIves/github-sponsors-readme-action, reproduced rather than reduced. A smaller probe
          # proves only that a smaller question is answerable: on 2026-10-23 a probe asking for nothing
          # but `totalCount` passed while the action reported "No sponsorship data was found… ❌",
          # which is its message for `data.viewer.sponsorshipsAsMaintainer` being absent, NOT for a
          # sponsor count of zero (that logs "Found 0 matching sponsors… 😢" instead). The two cannot
          # both be true of one query, so the difference lived in the fields the probe was not asking
          # for -- and the action never prints the response, because it does `return data.json()` and
          # reads the `errors` array nowhere. Keep this query identical to the action's when bumping it.
          curl -sS -X POST https://api.github.com/graphql \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"query":"query { viewer { login sponsorshipsAsMaintainer(first: 100, orderBy: {field: CREATED_AT, direction: ASC}, includePrivate: false, activeOnly: false) { totalCount pageInfo { endCursor } nodes { sponsorEntity { ... on Organization { name login url websiteUrl } ... on User { name login url websiteUrl } } createdAt privacyLevel tier { monthlyPriceInCents } } } } }"}' \
            > "$PROBE"
          PROBE="$PROBE" python3 - <<'PROBE_PY'
          import json
          import os
          import sys

          response = json.load(open(os.environ['PROBE']))

          # Printed before anything is judged: a partial GraphQL failure answers 200 with BOTH `data`
          # and `errors`, so an error here is not necessarily fatal and is not necessarily visible
          # anywhere else. `path` is what says which field was refused.
          for error in response.get('errors', []):
              path = '.'.join(str(p) for p in error.get('path', [])) or '<root>'
              print(f"::error::GitHub GraphQL [{error.get('type', 'ERROR')}] at {path}: "
                    f"{error.get('message')}")

          # A transport-level rejection (401/403) answers with GitHub's REST-shaped body -- a bare
          # `message`, no `errors` and no `data` -- so it would otherwise reach the failure below with
          # nothing printed to explain it.
          if 'data' not in response and 'message' in response:
              print(f"::error::GitHub refused the request: {response['message']}")

          maintainer = (response.get('data') or {}).get('viewer') or {}
          sponsorships = maintainer.get('sponsorshipsAsMaintainer')
          if sponsorships is None:
              # Exactly the condition the action tests before logging "No sponsorship data was found".
              print('::error::`data.viewer.sponsorshipsAsMaintainer` is absent, which is the state the '
                    'sponsors action reports as "No sponsorship data was found" and then writes an '
                    'empty block for. A classic PAT needs the read:user scope, plus read:org for an '
                    'organization account; the errors above, if any, name the actual refusal.')
              sys.exit(1)

          nodes = sponsorships.get('nodes') or []
          renderable = [n for n in nodes if n and n.get('privacyLevel') != 'PRIVATE']
          print(f"{maintainer.get('login')} has {sponsorships['totalCount']} sponsorships visible to "
                f"this token; {len(nodes)} returned, {len(renderable)} of them public.")
          for node in renderable:
              entity = node.get('sponsorEntity') or {}
              print(f"  - {entity.get('login') or '<no login>'} ({node.get('privacyLevel')})")

          # `include-private` is false, so the action renders exactly `renderable`. Zero of them means
          # the next step overwrites the sponsor block with nothing -- which is how four sponsors were
          # lost on 2026-10-05. For this account that is never a legitimate answer, so it fails here
          # rather than being committed.
          if not renderable:
              print('::error::No PUBLIC sponsorships came back, so the sponsors action would write an '
                    'empty block over whatever README.md currently holds. Refusing to continue.')
              sys.exit(1)
          PROBE_PY

      - name: Add GitHub Sponsors to Readme
        uses: https://github.com/JamesIves/github-sponsors-readme-action@v1.6.1
        with:
          token: ${{ secrets.GH_TOKEN }}
          active-only: false
          file: 'README.md'

      - uses: https://github.com/actions-cool/contributor-helper@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          update-files: 'README.md'
          update-places: '<!-- contributors -->/<!-- contributors end -->'
          repo: 'Griefed/ServerPackCreator'
          show-total: false
          style: 'base'
          avatar-width: '70'

      - uses: https://github.com/release-kit/hash-files@v1
        id: get-new-hash
        with:
          patterns: |
            README.md
      - name: New README hash
        run: echo ${{ steps.get-new-hash.outputs.hash }}

      - name: Push
        if: ${{ steps.get-current-hash.outputs.hash != steps.get-new-hash.outputs.hash }}
        # Secrets are passed via env (never interpolated into the command) and the token is sent in an
        # Authorization header rather than embedded in the push URL, so it can't leak into logs/error
        # traces. That property is deliberate and is kept here -- only the forge and token changed.
        # git is preinstalled on ubuntu-latest, so no apt-get is needed.
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_MAIL: ${{ secrets.GIT_MAIL }}
          FORGEJO_ACTOR: ${{ secrets.FJ_ACTOR }}
          FORGEJO_TOKEN: ${{ secrets.FJ_TOKEN }}
        run: |
          git config user.name "$GIT_USER"
          git config user.email "$GIT_MAIL"
          git add README.md
          git commit -m 'chore: Update sponsors and contributors'
          auth=$(printf '%s:%s' "$FORGEJO_ACTOR" "$FORGEJO_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: Basic ${auth}" \
            push "https://git.griefed.de/Griefed/ServerPackCreator.git" HEAD:refs/heads/main
