# Converted from `Check Packages:on-schedule` in .gitlab-ci.yml.
#
# GitLab drove this from a pipeline schedule (`only: schedules`); Forgejo has
# `on: schedule`, so the cadence lives here. Adjust the cron below to taste —
# POSIX syntax, UTC unless a timezone is given.
#
# The original cloned the repository into /tmp and mounted a volume to get the
# package list out of the container. Neither is necessary here: the workspace
# is already a checkout, and `apk info -v` can simply be read from stdout.
#
# This repository has no package_versions.txt yet; the first run creates and
# commits one, which is what the GitLab job's empty-file branch did.
name: Check packages

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  packages:
    name: Compare installed package versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: https://data.forgejo.org/docker/setup-buildx-action@v3

      # Loaded into the local docker image store rather than pushed, because
      # the next step has to run it.
      - name: Build image
        uses: https://data.forgejo.org/docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          tags: serverpackcreator-de:packagecheck

      - name: Collect package versions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh serverpackcreator-de:packagecheck \
            -c 'apk info -v' | sort > package_versions_new.txt
          docker image rm -f serverpackcreator-de:packagecheck

      - name: Commit changes
        shell: bash
        env:
          GIT_USER: ${{ vars.GIT_USER }}
          GIT_MAIL: ${{ vars.GIT_MAIL }}
          RELEASE_USER: ${{ secrets.RELEASE_USER }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          # `cmp` also covers the case where package_versions.txt does not exist
          # yet, which the GitLab job handled with a separate branch.
          if [ -f package_versions.txt ] && cmp -s package_versions.txt package_versions_new.txt; then
            echo "No package updates available."
            rm -f package_versions_new.txt
            exit 0
          fi

          echo "Package versions differ. Updating..."
          mv -f package_versions_new.txt package_versions.txt

          git config user.name "${GIT_USER:?repository variable GIT_USER is not set}"
          git config user.email "${GIT_MAIL:?repository variable GIT_MAIL is not set}"
          git add package_versions.txt
          git commit -m 'build: Update installed packages in Docker container.'

          # Credentials go on stdin, never onto the command line or into
          # .git/config, so they cannot leak through `ps` or the run log.
          git -c credential.helper='!f() { echo "username=${RELEASE_USER}"; echo "password=${RELEASE_TOKEN}"; }; f' \
            push origin "HEAD:${{ github.ref_name }}"

          echo "Packages updated."
